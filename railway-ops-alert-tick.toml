# Railway config for the `ops-alert-tick` cron service (MIP-772).
#
# Same Docker image as `backend-django`, run as a cron: the container
# starts every 5 minutes, runs `manage.py ops_alert_tick` once, exits.
#
# What this does:
#   Mails Ken (OPS_ALERT_EMAIL) whatever needs a person: alert.* security
#   events, a cron that failed or stopped succeeding (every other cron
#   records a heartbeat through its `--heartbeat` flag), a burst of 5xx
#   from backend-django, an OpenSearch certificate within 30 days of
#   expiry. All waiting alerts go in ONE email, and an incident is mailed
#   once however often it recurs. Each one links to its section of
#   genos-docs operations/ALERTS.md.
#
# Who watches this cron: genos-frontend's `uptime` workflow, from outside
# Railway, calls `api/v2/health/alerting/` (bearer OPS_HEALTH_TOKEN on
# backend-django), which answers 503 when this hasn't succeeded for 15
# minutes or an alert has waited that long. GitHub then mails the failed
# run. So it records its own heartbeat like the others.
#
# A failed send exits non-zero and leaves the alerts unsent: the next run
# retries, and the probe sees them waiting.
#
# ENV (per-service on Railway — NOT inherited): DATABASE_URL,
# DJANGO_SECRET_KEY, JWT_SECRET_KEY, FIELD_ENCRYPTION_KEYS, BLIND_INDEX_KEYS
# (RAILWAY_DEPLOY §3.1–3.2), plus
#   OPS_ALERT_EMAIL     the recipient. Without it the run fails while alerts wait.
#   EMAIL_BACKEND=anymail.backends.resend.EmailBackend, RESEND_API_KEY,
#   DEFAULT_FROM_EMAIL  same values as backend-django.
#   OPENSEARCH_HOST, OPENSEARCH_PORT, OPENSEARCH_USE_SSL=true,
#   OPENSEARCH_CA_CERT  for the certificate check; only the handshake is
#                       made, so no OpenSearch username or password.
# No Redis, no LLM/Vertex vars.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
cronSchedule = "*/5 * * * *"
startCommand = "sh /app/railway-ops-alert-tick-entrypoint.sh --heartbeat ops-alert-tick"
restartPolicyType = "NEVER"

# Dependabot (MIP-727).
#
# github-actions: every action in .github/workflows is pinned to a commit
# SHA with its release as a comment (`@<sha> # v4.4.0`). Dependabot reads
# that comment and opens a PR that moves both, so pins don't go stale.
#
# pip: version-update PRs are switched off (`open-pull-requests-limit: 0`)
# so the queue isn't flooded by every minor release. Security-update PRs
# ignore that limit; they come from the repo setting "Dependabot security
# updates", and read the Pipfile.lock this entry points at.
#
# docker (MIP-2269): the base image in the Dockerfile is pinned by digest
# (`FROM python:3.11-slim@sha256:...`). Dependabot moves the digest when the
# tag is rebuilt, so a patched base arrives as a reviewable PR. Python major and
# minor bumps are ignored: a new Python is a deliberate change.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

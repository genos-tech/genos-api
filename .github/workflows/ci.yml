name: CI

# Deps come from this repo's own Pipfile/Pipfile.lock (finalize via Step 2 of the
# split runbook: swap in the real Pipfile, then `pipenv lock`).
# Rollout: `backend-django` (tests) is the check to mark *required* first;
# `backend-django-lint` (ruff) stays report-only until a lint cleanup pass.
#
# Path filtering happens INSIDE the workflow (the `changes` job below +
# job-level `if`), NOT via `on.pull_request.paths`. Both jobs are listed as
# required-check contexts in the (currently disabled) branch ruleset; a
# trigger-level filter would leave those checks "Expected" forever on a
# docs-only PR and block its merge, whereas a job skipped by an `if`
# condition reports success. Pushes to main are never filtered.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (MIP-727): every job reads the repo and nothing more,
# unless it says otherwise below.
permissions:
  contents: read

concurrency:
  group: backend-django-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the PR's changed files so docs-only PRs skip the expensive
  # jobs. FAIL-OPEN by construction: any API hiccup, or any event that is
  # not a pull_request, yields code=true — an unnecessary extra run is
  # noise, but a silently green-skipped test would be a correctness bug.
  # The inert list is a deliberately narrow denylist (never an allowlist:
  # a new top-level config file must default to running CI).
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    # Listing the PR's files needs this. Without it the call fails and the
    # job fails open, so CI would still run, just on docs-only PRs too.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed files (fail-open)
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename') || files=""
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files:"; printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Evq '^docs/|\.md$|^LICENSE|^\.gitignore$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  backend-django:
    name: backend-django (required-first)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Dockerfile is python:3.11-slim and the code has no 3.12+ syntax, so 3.11
    # is the correct prod-parity version here.
    env:
      PIPENV_PIPFILE: ${{ github.workspace }}/Pipfile
      PIPENV_VENV_IN_PROJECT: "1"
      # Only DATABASE_URL is truly required (else settings fall back to an
      # unreachable hardcoded host). API keys default to "" and clients are
      # mocked, so they are intentionally NOT set.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/origin
      DJANGO_SETTINGS_MODULE: apis.settings_test
      DJANGO_SECRET_KEY: ci-test-secret-key
      JWT_SECRET_KEY: ci-test-secret-key
    services:
      postgres:
        # Match the local/Railway Postgres major (local docker-compose uses
        # postgres:15).
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: origin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pipenv==2026.7.1
      - name: Cache venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: ${{ runner.os }}-py311-pipenv-${{ hashFiles('Pipfile.lock') }}
      - name: Install deps (locked prod deps + test tooling)
        # django-anymail[resend] is in Pipfile.lock, so `pipenv sync`
        # installs it. The unpinned install that used to follow is gone:
        # it fetched whatever PyPI had that day, on every run.
        run: |
          pipenv sync
          pipenv run pip install -r requirements-dev.txt
      - name: Django system check
        run: pipenv run python manage.py check --settings=apis.settings_test
      - name: Migration drift check
        run: pipenv run python manage.py makemigrations --check --dry-run --settings=apis.settings_test
      - name: Tests + coverage
        # No --parallel: keeps coverage capture simple/correct. The migrations
        # dominate cold-start; revisit --parallel + multiprocessing coverage if
        # wall time becomes a problem.
        run: |
          pipenv run coverage run manage.py test origin.tests --settings=apis.settings_test
          pipenv run coverage xml
          pipenv run coverage report
      # Coverage is a report, not a gate: this job's verdict is the test run
      # above. `continue-on-error` keeps an upload failure from turning a
      # green test run red — the account-wide artifact storage quota is a
      # shared resource, so a build in ANOTHER repo can exhaust it and fail
      # this step for reasons that have nothing to do with this commit. That
      # is not a signal worth blocking a merge on (and it did block one).
      #
      # `retention-days` is the other half: these were uploaded with the
      # 90-day default and never pruned, so every run's ~80KB report was
      # still counted against the quota months later. Coverage is read, if
      # at all, while its PR is open, so a week is plenty.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: django-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  backend-django-lint:
    name: backend-django-lint (report-only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # ruff is a standalone binary; no project deps or DB needed. Pinned,
      # so a new ruff release can't change what this job reports overnight;
      # keep it in step with requirements-dev.txt.
      - run: pip install ruff==0.17.1
      - run: ruff check origin apis

  # Known-vulnerable dependencies (MIP-727; blocking since MIP-750, when the
  # lock was brought to zero advisories). An advisory published later turns
  # this red on every PR until the package is bumped with `pipenv upgrade`
  # (see the Pipfile header), or gets an `--ignore-vuln <id>` here with the
  # reason beside it. Dependabot security updates open those bumps.
  # Audits Pipfile.lock's hashed requirements without installing them, so
  # it needs no DB and takes seconds.
  pip-audit:
    name: pip-audit (required)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pipenv==2026.7.1 pip-audit==2.10.1
      - name: Audit the locked production deps
        run: |
          pipenv requirements --hash > "$RUNNER_TEMP/requirements.txt"
          pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip \
            --progress-spinner off --desc on

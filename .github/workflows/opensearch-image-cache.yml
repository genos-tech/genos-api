name: opensearch-image-cache

# Keeps the prod OpenSearch image in the Actions cache on `main` (MIP-953).
#
# A cache entry made on a pull request is visible to that pull request only, while one
# made on `main` is visible to all of them. The eval workflows only reach for the image
# when an agent change needs them, so without this nothing would put it on `main`, and
# each new pull request would pay for a pull from Artifact Registry (billed egress).
#
# Entries unused for 7 days are evicted, so a weekly run keeps it. Pull requests that
# touch the action or this file run it too, to test the change before it merges.
#
# No Vertex call and no eval: it only pulls and caches (or, on a hit, loads) the image.
on:
  push:
    branches: [main]
    paths:
      - ".github/actions/opensearch-image/**"
      - ".github/workflows/opensearch-image-cache.yml"
  pull_request:
    paths:
      - ".github/actions/opensearch-image/**"
      - ".github/workflows/opensearch-image-cache.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the WIF OIDC token

# Not cancel-in-progress: cancelling a run mid-save leaves nothing cached.
concurrency:
  group: opensearch-image-cache-${{ github.ref }}

env:
  AR: asia-northeast1-docker.pkg.dev/amplified-album-496413-t2/genos

jobs:
  cache-image:
    name: cache the prod OpenSearch image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (keyless WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: ./.github/actions/opensearch-image
        with:
          image: ${{ env.AR }}/opensearch-multilingual:3.6.0

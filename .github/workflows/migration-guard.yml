name: migration-guard

# Two PRs that each add `0220_*` pass CI alone and only conflict once both are on
# `main`: `manage.py migrate` then refuses to run and the deploy fails (MIP-873 on
# 2026-11-01, MIP-1071 on 2026-11-06). CI tests each PR against the `main` of the
# moment it ran, so the second PR's green check is stale by the time it merges.
#
# The commit status `migration-leaf` on a PR's head commit is the gate, and it is required in
# the branch ruleset. Two jobs, because they need different power:
#   * `check` (a pull_request): the PR merged with its base must have exactly one leaf
#     migration per app (scripts/check_migration_leaves.py). It only RUNS the check and saves
#     the result. `migration-guard-report.yml` posts the status from it, because a pull_request
#     run by Dependabot or from a fork gets a read-only token and could not post it itself,
#     which would leave its PR "Expected" forever;
#   * `retest` (a push to main, or by hand): every OPEN PR is tested again against the new
#     `main`, and the status is posted from here (a push run has a write token). When PR A
#     merges, PR B turns red before B is merged, with nothing else re-run and no "branch is
#     out of date" step for anyone. A PR that touches no migrations is posted green.
#
# `workflow_dispatch` takes a `base` branch, which is how the guard is exercised without
# touching `main`: a scratch base with two PRs that add the same number.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Branch whose open PRs are re-tested (default: the branch the run is on)"
        required: false

permissions:
  contents: read

# The newest `main` is the only one worth testing against, and a PR's newest commit is the
# only one whose status counts.
concurrency:
  group: migration-guard-${{ github.event_name == 'pull_request' && github.ref || format('base-{0}', inputs.base || github.ref_name) }}
  cancel-in-progress: true

env:
  CONTEXT: migration-leaf

jobs:
  check:
    name: migration-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checkout is GitHub's merge of the PR into its base as of now.
      - name: Test the PR merged with its base
        run: |
          set +e
          out=$(python3 scripts/check_migration_leaves.py . 2>&1); code=$?
          printf '%s\n' "$out"
          mkdir -p result
          python3 -c 'import json,sys; json.dump({"code": int(sys.argv[1]), "message": sys.argv[2]}, open("result/result.json","w"))' "$code" "$out"
          # The status comes from `migration-guard-report.yml`. This job fails too so the run
          # is red where people look.
          exit $code

      - name: Save the result for the reporter
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-leaf-result
          path: result/result.json
          if-no-files-found: ignore
          retention-days: 3

  retest:
    name: migration-guard (retest open PRs)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merging a PR head into the base needs both histories.
          fetch-depth: 0

      - name: Re-test open PRs against the new base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base || github.ref_name }}
        run: bash scripts/retest_migration_prs.sh "$BASE"

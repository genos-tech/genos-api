# Retrieval quality gate for the Spotlight / Genos AI agent (MIP-1527 trimmed it to what it can
# actually see).
#
# WHAT THIS RUNS. `agent_eval --retrieval` against a deterministic seeded fixture: the seed corpus is
# re-indexed (Vertex embeddings), then 75 cases call `search()` (BM25 + vector + RRF); each call
# runs the query rewriter, one small Gemini call, unless the case pins `rewrite: false` (MIP-860).
# The reranker is OFF here. The gate fails when fewer cases pass, or mrr / recall_at_n are lower,
# than the floors in `scripts/retrieval_gate.py` (the only place they live).
#
# WHAT IT CANNOT SEE, ON PURPOSE. Nothing in `search()` or the rewriter imports the agent's prompts,
# tool declarations, tool results or loop, so an edit to those cannot move one number of this run
# (the audit: #772 and #782 turned agent flags on and the run passed 66/75 unchanged). They are not
# triggers any more. What covers them: the free tests (flag pins, the prefix budget, tool-registry /
# approval tests; a committed `agent_fingerprint` golden is the next PR) on every PR, and the grouped paid run
# (`agent_eval_group`, lead-run, with a cost cap) per batch. There is NO live behaviour eval in CI:
# the one-case "behaviour + judge smoke" and the nightly / trajectory workflows are gone or off.
#
# WHEN IT RUNS (the single list of retrieval files is `RETRIEVAL_PATHS` in scripts/agent_eval_gate.py,
# mirrored by `pull_request: paths:` below; a test pins that they agree):
#   * a PR that changes one of those files, or Pipfile(.lock), or this workflow;
#   * weekly on `main` (`schedule`), which catches what no path rule does: a change in
#     `origin/models/**`, `apis/settings.py` or a model behaving differently;
#   * by hand (`workflow_dispatch`), and on a PR labelled `run-evals`.
# It does NOT run on a push to main. A merge was only ever a repeat of the run its PR had just done
# (32 of 55 heavy runs since 11-01), and a successor's push cancelled its predecessor's, so it
# protected nothing.
#
# Auth is keyless via Workload Identity Federation; the SA it impersonates has
# roles/aiplatform.user, so CI calls the SAME Vertex (embeddings + Gemini) as
# prod — no API keys stored.
#
# Required GitHub secrets (from `terraform output` in genos-platform/infra/gcp,
# or from the identity-only restore in genos-docs ENVIRONMENTS.md §CI):
#   GCP_WIF_PROVIDER  = wif_provider
#   GCP_DEPLOY_SA     = deploy_service_account
#
# Required repo VARIABLE:
#   RUN_AGENT_EVALS = "true"  -> run the GCP-backed evals.
#
# THE GATE JOB (MIP-1101, simplified in MIP-1537). A cheap job (no secrets, no Vertex, no OIDC token,
# no database, no Python dependencies) lists the files the PR changes, and `scripts/agent_eval_gate.py`
# decides whether the billed steps start:
#   * a changed file in RETRIEVAL_PATHS, a `run-evals` label, a dispatch or the weekly schedule -> run;
#   * otherwise -> skip (the job still ends SUCCESS). This is how an edit of this workflow alone is
#     tested for free: it matches `paths:` but changes no retrieval file;
#   * an unreadable file list or any failure inside the gate -> the evals RUN (fail open).
# It used to hash what the in-app model is shown and also ran on "the hash moved". That rule was
# removed: the retrieval suite cannot see prompts or tool declarations, and the free golden test
# `origin.tests.test_agent_fingerprint_golden` already fails when what the model reads changes.
# Escapes: label a PR `run-evals` to force the run, `skip-evals` to force the skip, or start the
# workflow by hand (`dry_run` only prints the decision). See the README "CI" section.
#
# ⚠️ `RUN_AGENT_EVALS` is deliberately SEPARATE from `DEPLOY_TO_GCP`.
# They used to be the same switch, which meant that turning off GCP
# *hosting* (2026-07-30, the app moved to Railway-only) silently turned
# off the quality gate for a month — evals only need Vertex, which is a
# project-level API, and never needed the app to run on GCP. Either variable
# set to "true" lets the scheduled and manual runs start; a PR run needs neither
# to start but its billed steps need `RUN_AGENT_EVALS` (see the `gcp` step).

name: agent-evals

on:
  # Paths = the files the retrieval suite really exercises, and nothing else. The list is
  # `RETRIEVAL_PATHS` in scripts/agent_eval_gate.py (a test fails when the two drift apart); the
  # reasons for each line and for what is left out are written there. In short: search, the query
  # rewriter, rerank, the chunkers / embeddings / ingestion that build the index, the model client
  # the rewriter calls, the retrieval cases + fixture + runner + the two commands CI invokes, the
  # seeded corpus, and the dependencies. NOT the agent prompts, tools, controller or result fencing
  # (this run cannot see them: they are covered by the free tests and the grouped paid run), NOT
  # `apis/settings.py` (changes for agent flags and billing nearly every day; the weekly run catches a
  # retrieval knob), NOT `origin/models/**` (weekly run).
  #
  # `labeled` is here only so the `run-evals` label starts a run; every other label is ignored by
  # the job `if`s and by the concurrency group (it never cancels a run in progress).
  #
  # There is deliberately NO `push: branches: [main]` any more (see the header). That also means
  # the Cloud Run deploy job that used to follow the evals is gone (MIP-1537, see the end of the file).
  #
  # Required-check caveat: if this is ever made a required check, a path-filtered skip leaves it
  # pending forever, so add an always-passing companion job first (the ruleset does not require it
  # today).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "origin/search_engine/search.py"
      - "origin/search_engine/query_rewriter.py"
      - "origin/search_engine/reranker.py"
      - "origin/search_engine/friendly_titles.py"
      - "origin/search_engine/milestone_mirrors.py"
      - "origin/search_engine/ingestion.py"
      - "origin/search_engine/chunkers/**"
      - "origin/search_engine/embeddings/**"
      - "origin/search_engine/index_config.py"
      - "origin/search_engine/mapping_guard.py"
      - "origin/search_engine/opensearch_client.py"
      - "origin/search_engine/acl_dirty.py"
      - "origin/search_engine/note_context.py"
      - "origin/search_engine/text_extraction.py"
      - "origin/search_engine/llm/__init__.py"
      - "origin/search_engine/llm/base.py"
      - "origin/search_engine/llm/types.py"
      - "origin/search_engine/llm/choice.py"
      - "origin/search_engine/llm/effort_router.py"
      - "origin/search_engine/llm/gemini_client.py"
      - "origin/search_engine/agent/acl.py"
      - "origin/search_engine/agent/tools/template_prompts.py"
      - "origin/search_engine/agent/mentions.py"
      - "origin/search_engine/agent/evals/retrieval_cases.yaml"
      - "origin/search_engine/agent/evals/fixture.py"
      - "origin/search_engine/agent/evals/runner.py"
      - "origin/search_engine/management/commands/agent_eval.py"
      - "origin/search_engine/management/commands/agent_eval_setup.py"
      - "origin/services/demo_seeder.py"
      - "Pipfile"
      - "Pipfile.lock"
      # The gate's own workflow: an edit runs it once, which is how it is tested. The hashes are
      # no retrieval file changes for such an edit, so the Vertex steps are skipped (the cheap `gate` job still runs).
      - ".github/workflows/agent-evals.yml"
  # Weekly, on `main`, retrieval suite only (the only suite this workflow has). Off-peak Vertex
  # window (Tue 02:00 JST). Gated by the same repo variable as every other scheduled eval
  # (`RUN_AGENT_EVALS` or `DEPLOY_TO_GCP` == "true"), so with both off it is a skipped job.
  schedule:
    - cron: "0 17 * * 1"
  # By hand. Always runs the evals (it is the escape hatch); `dry_run` runs only the gate job
  # and prints what the gate would have decided for this ref against `main` (a free way to check it).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the gate's decision; start no Vertex step"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # mint the WIF OIDC token

# A label event gets a group of its own (named by the label), so an unrelated `labeled` run can
# never cancel the run a push started, and a `run-evals` run is not cancelled by another label.
concurrency:
  group: agent-evals-${{ github.ref }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'code' }}
  cancel-in-progress: true

env:
  GCP_PROJECT: amplified-album-496413-t2
  GCP_REGION: asia-northeast1
  AR: asia-northeast1-docker.pkg.dev/amplified-album-496413-t2/genos
  # The retrieval gate's pass / mrr / recall floors are NOT set here: they live in ONE place,
  # scripts/retrieval_gate.py. The gate runs with the LLM reranker OFF (RAG_USE_RERANKER=false in
  # the job env) so it is fast and mostly deterministic; the numbers sit below the reranked prod run.

jobs:
  # The cheap half (MIP-1101): decides whether `agent-evals` below may start its billed steps.
  # No secrets, no Vertex, no OIDC token (`permissions: contents: read` only), no database and no
  # Python dependencies (the stdlib `python3` of the runner is enough): it lists the files the PR
  # changes and runs scripts/agent_eval_gate.py. FAIL-OPEN end to end: every step but the checkout is
  # `continue-on-error`, so a step that breaks leaves no answer and the evals run; the job itself
  # stays green so a broken gate does not also paint the PR red.
  #   pull_request  the files changed by the PR merged into its base (what GitHub checks out; the
  #                 base is that merge's first parent, i.e. `main` right now);
  #   dispatch / schedule  no file list is needed: the gate answers "run" for both.
  gate:
    name: gate (which files changed)
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'labeled'
       || github.event.label.name == 'run-evals')
      && (github.event_name == 'pull_request' || vars.RUN_AGENT_EVALS == 'true'
          || vars.DEPLOY_TO_GCP == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its first parent

      - name: List the changed files
        id: base
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
        run: |
          [ "$EVENT" = "pull_request" ] || exit 0
          base=$(git rev-parse --verify -q 'HEAD^1^{commit}' || true)
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::No usable base commit (${base:-none}): the gate fails open and the evals run."
            exit 0
          fi
          echo "base: $base"
          git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "changed files:"; cat "$RUNNER_TEMP/changed.txt"

      - name: Decide
        id: gate
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          # An env var, never `${{ }}` inside the script: a label name is user-controlled text.
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed.txt
        run: python3 scripts/agent_eval_gate.py

  agent-evals:
    name: agent-evals (quality gate)
    # On PRs the `on: pull_request: paths:` filter above already limits this to retrieval files. The
    # weekly `schedule` and a manual dispatch run when evals are enabled at all (RUN_AGENT_EVALS) or
    # DEPLOY_TO_GCP is on; with both off they skip the whole job (skipped-via-`if` reports SUCCESS,
    # no required-check deadlock). When it does run, the Vertex-billed steps are skipped unless the
    # `gate` job says run (a retrieval file changed, a label, the schedule, a dispatch).
    # `needs: gate` + `!cancelled()`: a `gate` job that FAILED still lets this run (its
    # output is empty, which reads as "run"). Only a `gate` that was skipped on purpose (an
    # unrelated label, or nothing enabled for a schedule / dispatch) skips this too.
    needs: gate
    if: >-
      !cancelled() && needs.gate.result != 'skipped'
      && (github.event_name == 'pull_request' || vars.RUN_AGENT_EVALS == 'true'
          || vars.DEPLOY_TO_GCP == 'true')
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/origin
      DJANGO_SECRET_KEY: ci-eval-secret-key
      JWT_SECRET_KEY: ci-eval-secret-key
      OPENSEARCH_HOST: localhost
      OPENSEARCH_PORT: "9200"
      # CI uses the same Vertex path as prod (embeddings + Gemini) via WIF ADC.
      LLM_PROVIDER: gemini
      GEMINI_USE_VERTEX: "true"
      GEMINI_PROJECT: amplified-album-496413-t2
      GEMINI_LOCATION: asia-northeast1
      # LLM calls use the global endpoint, mirroring prod (both Railway's
      # GEMINI_LOCATION=global and the GCP service's vertex_llm_location =
      # "global" in terraform.tfvars). gemini-3.6-flash and
      # gemini-3.5-flash-lite are NOT served in asia-northeast1 — without
      # this override every Gemini LLM call here 404s (NOT_FOUND) while the
      # regional gemini-embedding-001 keeps working, so retrieval stays
      # green and the behavior/judge suites die silently. Embeddings stay
      # on GEMINI_LOCATION: the region their OpenSearch index was built in.
      GEMINI_LLM_LOCATION: global
      EMBEDDING_PROVIDER: vertex
      # Cost: pin CI evals to the cheap light rung rather than inheriting
      # the server default (gemini-3.6-flash, $1.50/$7.50 per 1M).
      # gemini-3.5-flash-lite is $0.30/$2.50 — ~5x/3x cheaper — and
      # LLM_SPEND_MAP.md §7 already names it as the eval/mechanical-task
      # model of choice. Unlike the gemini-2.5-flash it replaced, it is
      # IN the catalog (apis/llm_models.yaml), so quota and per-model
      # telemetry attribute eval runs correctly instead of to a model
      # nothing else knows about. The retrieval gate's only LLM call is the
      # query rewrite (RAG_USE_QUERY_REWRITE, default on; a case can pin it
      # off with `rewrite: false`). With no RAG_REWRITE_MODEL / effort pin it
      # inherits GEMINI_MODEL, so this setting reaches the gate too, not only
      # the report-only behavior suite + judge.
      # NB: a step-change in judge scores right after this landed is the
      # cheaper judge, not a quality regression — re-baseline the trend.
      # If a run starts 404-ing, check REGION first (is the model served
      # at GEMINI_LLM_LOCATION? — this exact model launched global-only,
      # which is why that override exists above); only if the model is
      # gone everywhere has it been retired — then drop this line to fall
      # back to the server default.
      GEMINI_MODEL: gemini-3.5-flash-lite
      # Reranker OFF for the gate: it adds a Gemini call per query
      # (non-deterministic, slow, Vertex-quota-bound). The gate tests the
      # retrieval core (BM25 + vector + RRF); the query rewrite stays ON
      # (RAG_USE_QUERY_REWRITE is not set here), so verdicts vary a little
      # run to run, except for cases that pin `rewrite: false`.
      RAG_USE_RERANKER: "false"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: origin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      # Whether this run needs the (Vertex-billed, multi-minute) eval is decided by the `gate`
      # job above (retrieval files changed, the `run-evals` / `skip-evals` labels, a dispatch or the
      # weekly schedule; equal hashes with no retrieval file skip; it fails open). Here it is only
      # read: `run=false` is the one value that skips the billed steps, and an empty or any other
      # value (a `gate` job that broke) runs them. The job still finishes SUCCESS when skipped,
      # so a future required-check cannot deadlock on it (the concern in the `on:` comment).
      # The Vertex-billed steps need a live GCP project: WIF has no pool to
      # federate against once the env is torn down, so `auth@v2` fails with
      # `invalid_target` BEFORE anything is spent. That is not a quality
      # regression and must not read as one — every PR touching
      # `origin/search_engine/**` went red at this step after the 2026-07-30
      # teardown. Treat "no GCP" as "skip, loudly", the same shape as "no
      # eval-relevant paths".
      #
      # `RUN_AGENT_EVALS` is "CI may use Vertex"; `DEPLOY_TO_GCP` implies it
      # (a deploy must never ship ungated). The secret check is
      # belt-and-braces for a repo where neither var was ever set.
      # THE GATE IS INERT WHILE THIS SKIPS — retrieval regressions will not
      # be caught on a PR until the identity is restored (the procedure is
      # in genos-docs operations/ENVIRONMENTS.md §CI; it re-creates NO app
      # infrastructure and costs nothing).
      - name: Is a Vertex-backed eval possible at all?
        id: gcp
        run: |
          if { [ "${{ vars.RUN_AGENT_EVALS }}" = "true" ] || [ "${{ vars.DEPLOY_TO_GCP }}" = "true" ]; } \
             && [ -n "${{ secrets.GCP_WIF_PROVIDER }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vertex-backed evals unavailable (set RUN_AGENT_EVALS=true and the GCP_WIF_PROVIDER secret) — the agent eval gate is INERT for this run."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide if the eval is needed (gate job)
        id: changes
        env:
          GATE_RUN: ${{ needs.gate.outputs.run }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          if [ "${{ steps.gcp.outputs.available }}" != "true" ]; then
            echo "No GCP env — nothing to authenticate against."
            echo "relevant=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GATE_RUN" = "false" ]; then
            echo "Gate: skip. $GATE_REASON"
            echo "relevant=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Gate: run (${GATE_REASON:-no answer from the gate job: failing open})."
          echo "relevant=true" >> "$GITHUB_OUTPUT"

      - name: Eval skipped — nothing measured, job ends green
        if: steps.changes.outputs.relevant != 'true'
        run: |
          if [ "${{ steps.gcp.outputs.available }}" != "true" ]; then
            echo "Skipped because the GCP env is unavailable, NOT because the change is safe."
            echo "Re-run this workflow once GCP is back, or move the evals to Railway."
          else
            echo "Skipping the Vertex eval: no retrieval file changed (see the gate job). The weekly run on main still covers retrieval."
          fi
          echo "Skipped, not passed: nothing was measured. The job ends green so it cannot block."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.relevant == 'true'

      - name: Authenticate to Google Cloud (keyless WIF)
        if: steps.changes.outputs.relevant == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.changes.outputs.relevant == 'true'

      # From the Actions cache when it has the image, so a run doesn't pay for a pull
      # from Artifact Registry (MIP-953). Keep the tag in step with the `docker run`.
      - name: Fetch the prod OpenSearch image
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/opensearch-image
        with:
          image: ${{ env.AR }}/opensearch-multilingual:3.6.0

      - name: Start multilingual OpenSearch (prod image)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          docker run -d --name opensearch -p 9200:9200 \
            --ulimit memlock=-1:-1 --ulimit nofile=65536:65536 \
            -e discovery.type=single-node -e bootstrap.memory_lock=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true -e DISABLE_SECURITY_PLUGIN=true \
            -e OPENSEARCH_JAVA_OPTS="-Xms1g -Xmx1g" \
            "$AR/opensearch-multilingual:3.6.0"
          echo "waiting for OpenSearch to be green..."
          for i in $(seq 1 40); do
            curl -sf localhost:9200/_cluster/health >/dev/null && { echo "up"; break; }
            sleep 5
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip pipenv
        if: steps.changes.outputs.relevant == 'true'
      - name: Install deps
        if: steps.changes.outputs.relevant == 'true'
        run: |
          pipenv sync
          pipenv run pip install -r requirements-dev.txt

      # Throwaway keyrings for this run's database (MIP-619): the seed looks
      # users up by email through the blind index, and once the PII columns
      # are encrypted no user row reads without the keyring. Generated per
      # run, so no key is committed.
      - name: Generate per-run encryption keys
        if: steps.changes.outputs.relevant == 'true'
        run: |
          python - <<'PY'
          import base64, os, secrets
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for name in ("FIELD_ENCRYPTION_KEYS", "BLIND_INDEX_KEYS"):
                  key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
                  print(f"::add-mask::{key}")
                  env.write(f"{name}={key}\n")
          PY

      - name: Migrate + set up OpenSearch index + seed fixture (Vertex reindex)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          pipenv run python manage.py migrate --noinput
          # MUST run before any write: creates knowledge_chunks_* with the
          # knn_vector mapping. Skipping it lets the first reindex auto-create
          # the index with a default mapping, so `embedding` isn't a knn_vector
          # and every vector search 400s (silent keyword-only fallback → mrr=0).
          pipenv run python manage.py opensearch_setup
          pipenv run python manage.py agent_eval_setup --reseed

      # --- HARD GATE: the retrieval suite (the only suite this workflow runs) ---
      # The suite exits 1 on its documented-red cases, so its own exit code is ignored (`|| true`);
      # scripts/retrieval_gate.py decides, on the floors it holds (the one place they live).
      - name: Retrieval evals — quality gate
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -o pipefail
          pipenv run python manage.py agent_eval --retrieval | tee eval.out || true
          python3 scripts/retrieval_gate.py eval.out

  # No deploy job. A Cloud Run deploy used to follow the evals on a push to main (gated on
  # `DEPLOY_TO_GCP`, with a post-deploy smoke query and an automatic revert). MIP-1527 removed the
  # push trigger, so it could not start, and the GCP environment was destroyed on 2026-07-30 (the app
  # runs on Railway). MIP-1537 deleted it; `git log -- .github/workflows/agent-evals.yml` has the
  # last version. To bring GCP hosting back: re-add `push: branches: [main]` and a deploy job, and
  # note that a push run would then gate the deploy with a retrieval run that cannot see the agent.

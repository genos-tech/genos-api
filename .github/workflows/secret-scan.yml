name: secret-scan

# Blocking gitleaks scan of the commits a push or PR adds (MIP-720).
#
# Only `base..head` is read, so history doesn't fail it: history was
# audited once, and every finding there is either revoked or reviewed into
# `.gitleaksignore`, one fingerprint per line with the reason it is safe.
#
# Its own workflow rather than a job in ci.yml, and with no path filter:
# ci.yml skips docs-only PRs, and a key pasted into a README leaks the
# same as one in code.
#
# The CLI is pinned and checksummed instead of using gitleaks-action, which
# needs a paid license on organization repos. Findings are fully redacted
# in the log, because genos-frontend's Actions logs are public.
#
# On a finding: if it's a false positive, add the fingerprint the log
# prints to `.gitleaksignore` with a comment saying why. If it's real,
# revoke the secret first (rewriting the branch doesn't unpublish it), then
# remove it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan walks base..head

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push with no usable `before` (a repo's first push, or a force
          # push whose old tip isn't in the clone) scans all of history
          # rather than nothing.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          else
            echo "::warning::No base commit to diff against; scanning all of history."
            range="$HEAD"
          fi
          echo "Scanning $range"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact=100 --verbose --no-banner .

# =====================================================================
#  Genos LLM model catalog
# =====================================================================
#
#  THE ONE FILE TO EDIT WHEN A PROVIDER SHIPS A NEW MODEL.
#
#  Everything downstream is derived from here at boot by
#  `apis/llm_catalog.py`:
#
#    * SEARCH_ENGINE["MODEL_CATALOG"] — the Settings model picker
#      (`GET /agent/models/`) and the `(provider, model)` allowlist that
#      `resolve_user_choice` validates a saved preference against.
#    * SEARCH_ENGINE["TIER_QUOTAS"][<tier>]["model_daily"] — the
#      per-model daily caps the quota engine enforces.
#
#  That second one is why the caps live here rather than in settings.py.
#  A model MISSING from `model_daily` is treated as UNLIMITED, not zero,
#  so under the old hand-written table adding a rung and forgetting to
#  add it to all four tiers silently uncapped a premium model — no
#  error, no 429, just an unbounded subsidy. Here a model inherits its
#  class's cap automatically, so that mistake is not expressible.
#
# ---------------------------------------------------------------------
#  HOW TO SWAP A MODEL
# ---------------------------------------------------------------------
#
#   1. Edit the entry below (or add one and delete the old one).
#   2. Keep each provider's list ordered CHEAPEST FIRST. This is a
#      contract, not a style choice — `cheaper_models_same_provider()`
#      walks the list backwards for quota fallback, and the picker
#      renders in this order. The loader ASSERTS non-decreasing price
#      and refuses to boot otherwise, so a rung inserted in the wrong
#      slot fails immediately instead of silently mis-ordering.
#   3. If the new model is the provider's default, update
#      GEMINI_MODEL / CLAUDE_MODEL / OPENAI_MODEL in settings.py —
#      `test_default_models_are_in_catalog` fails if you forget.
#   4. Run the api test suite. Nothing else needs touching: no
#      migration, no frontend change (labels and notes are served from
#      here), no per-tier quota edit.
#
#  Users who had the REMOVED model saved keep their provider — a stale
#  model resolves to that provider's server default, not to Gemini.
#  See `resolve_user_choice` in llm/choice.py.
#
#  Full runbook, incl. what to check on Vertex Model Garden first:
#  genos-docs/operations/MODEL_SWITCHING.md
#
# ---------------------------------------------------------------------
#  FIELDS
# ---------------------------------------------------------------------
#
#   model    (req) exact id sent to the provider API.
#   class    (req) light | middle | highend — picks the tier caps below.
#
#                  ⚠️ `class` is a COST bucket (yen per ask), NOT the
#                  marketing tier and NOT the rung the user sees. Its
#                  only job is to choose a daily cap, and caps exist to
#                  bound worst-case spend — so a model belongs to the
#                  class its ¥/ask lands in, full stop.
#
#                  The user-facing "light / middle / highend" choice is
#                  simply LIST POSITION: three entries per provider,
#                  cheapest first. The two usually agree. They do not
#                  agree for Gemini, whose priciest model ($2/$12) is
#                  still only mid-cost — so Gemini has no `highend`
#                  entry at all, and that is correct: Gemini is the
#                  cheap provider and its rungs get generous caps.
#                  Classing them upward "to look symmetrical" would
#                  meter the DEFAULT MODEL at 12 asks/day on core.
#
#   label    (req) shown in the Settings picker.
#   note     (req) one-line help text under the label in the picker.
#   price    (req) USD per 1M tokens, public list price. Used to ASSERT
#                  the cheap→expensive ordering, and it is the ONLY
#                  price source for the offline cost aggregator and the
#                  internal cost ledger.
#
#                  ALL FOUR keys are required — `input`, `output`,
#                  `cached_input`, `cache_write`. `cached_input` and
#                  `cache_write` used to be optional, and the result was
#                  that 5 of 9 models had no cache rate at all while
#                  Claude prompt caching was live in production. A cache
#                  rate that defaults to "same as input" silently
#                  over-bills the cached path by 10x; one that defaults
#                  to zero silently under-bills. Neither is detectable
#                  from the output, so both are required and 0 must be
#                  written deliberately.
#
#                  Use 0 for "this provider does not bill this line" —
#                  Gemini's implicit cache and OpenAI's automatic cache
#                  have no separate write charge, so their `cache_write`
#                  is a real 0, not a missing value.
#
#                  Two conventions the current numbers follow (re-derive
#                  rather than assume on a swap — providers change these
#                  independently of the headline rate):
#                    * cached_input = 10% of input, all three providers.
#                    * Anthropic cache_write = 125% of input (5-min TTL).
#   supports_temperature (opt, default true) — false for models whose
#                  API rejects `temperature`. Read by
#                  llm/claude_client.py.
#
#                  Anthropic returns a hard 400 "`temperature` is
#                  deprecated for this model." on its newer families.
#                  This is NOT theoretical: the adapter used to guard
#                  with `startswith("claude-opus-4-7")`, so when
#                  claude-opus-4-8 joined the catalog on 2026-07-25
#                  EVERY opus-4-8 ask 400'd. Verified by calling the
#                  API. Test a new model BOTH ways before listing it —
#                  one request each, and it is the only proof.
#
#  Prices verified 2026-07-25. Re-check on every swap; they move.
# =====================================================================

version: 1

# =====================================================================
#  RATE CARD — the money metadata every cost row is stamped with
# =====================================================================
#
#  The cost ledger materializes yen at WRITE time and stores the rate
#  card it used, so a later price change can never retroactively
#  restate a past request. Reports GROUP BY the rate card rather than
#  summing across a mid-period price change.
#
#  `label` is for humans. The grouping key is a `fingerprint` the
#  loader COMPUTES from every price plus the FX rate — because the
#  thing that must never happen is two different price regimes sharing
#  one identifier, and relying on an editor to remember to bump a
#  string is exactly how that happens. Edit any price and the
#  fingerprint moves on its own; forget to touch `label` and the rows
#  are still correctly separated.
#
#  `fx_jpy_per_usd` is a PINNED constant, deliberately not a live
#  lookup: a ledger whose historical totals drift with today's
#  exchange rate cannot be reconciled against an invoice. Bump it when
#  you want new rows to use a new rate; old rows keep theirs.
#
#  Provider invoices are in USD, so reconcile in USD (exact) and read
#  reports in JPY (normalized).
#
rate_card:
    label: "2026-07-25"
    fx_jpy_per_usd: 150

providers:
    # -----------------------------------------------------------------
    # Gemini — via Vertex AI in prod (GEMINI_USE_VERTEX=true). This is
    # the default provider and carries most volume.
    # -----------------------------------------------------------------
    gemini:
        - model: gemini-3.5-flash-lite
          class: light
          label: Gemini 3.5 Flash-Lite
          note: Fastest and cheapest — great for everyday questions.
          price: { input: 0.30, output: 2.50, cached_input: 0.03, cache_write: 0 }
          # Released 2026-07-21. Replaces gemini-3.5-flash as the light
          # rung: 5x cheaper in, 3.6x cheaper out. Since Gemini is the
          # server default and the free tier's headline number, this is
          # the single largest real-spend lever in the catalog — and it
          # is the model to point RAG_RERANKER_MODEL / RAG_REWRITE_MODEL
          # at (LLM_SPEND_MAP.md section 7, levers 2 and 3).

        - model: gemini-3.6-flash
          class: light
          label: Gemini 3.6 Flash
          note: Balanced speed and quality — the default.
          price: { input: 1.50, output: 7.50, cached_input: 0.15, cache_write: 0 }
          # Released 2026-07-21. The server default (GEMINI_MODEL), and
          # the direct successor to gemini-3.5-flash: same input price,
          # 17% cheaper output, and it beats 3.1 Pro on coding.
          #
          # `light` because gemini-3.5-flash was flash-class (~JPY1-2 per
          # ask) and this is cheaper still. Light caps equal the umbrella
          # `llm_ask_daily`, i.e. the default model is effectively
          # unmetered — which is exactly what it must be.
          #
          # The 10x cached-input discount matters more here than the
          # headline rate: Genos re-sends 57 tool schemas on every call,
          # which is precisely the stable prefix implicit caching rewards
          # (LLM_SPEND_MAP.md section 2).

        - model: gemini-3.1-pro-preview
          class: middle
          label: Gemini 3.1 Pro Preview
          note: Extended thinking, for the hardest questions.
          price: { input: 2.00, output: 12.00, cached_input: 0.20, cache_write: 0 }
          # Gemini's TOP rung as the user sees it (third of three), but
          # cost class `middle` — at $2/$12 it is nowhere near the
          # ~JPY60-70/ask premium band that opus-5 and sol occupy, and a
          # cap sized for those would be gratuitously tight here.
          # Unchanged from the previous catalog, where it was also mid.
          #
          # Two caveats worth knowing:
          #   * gemini-3.6-flash above reportedly beats it on coding at
          #     lower cost, so this is a thinking-depth rung, not a
          #     quality-dominance one.
          #   * Price steps to $4.00/$18.00 above 200K context, and the
          #     57-tool prefix means Genos reaches long contexts on
          #     ordinary asks — the effective rate is often the higher
          #     one. That is the main reason not to make it the default.
          #
          # Keep the `-preview` suffix: GA reporting is contradictory and
          # this id is the one known to serve.
          #
          # Google currently ships nothing in the premium cost band, so
          # Gemini has no `highend` entry. That is a fact about Google's
          # lineup, not a gap to paper over.

    # -----------------------------------------------------------------
    # Claude — DIRECT to the Anthropic API (`anthropic.Anthropic(api_key
    # =CLAUDE_API_KEY)` in llm/claude_client.py). Despite what older docs
    # said, there is no Vertex Model Garden path in this codebase, so
    # Model Garden availability is NOT the constraint on adding a model —
    # anything the Anthropic API serves works. Bills to the Anthropic
    # account, outside GCP, like OpenAI.
    #
    # All three ids below were called for real on 2026-07-25 before
    # being listed. Do the same for any new one — it takes one request
    # and it is the only thing that actually proves an id serves.
    # -----------------------------------------------------------------
    claude:
        - model: claude-haiku-4-5
          class: light
          label: Claude Haiku 4.5
          note: Fast and economical.
          price: { input: 1.00, output: 5.00, cached_input: 0.10, cache_write: 1.25 }

        - model: claude-sonnet-5
          class: middle
          label: Claude Sonnet 5
          note: Near-Opus quality at a working-day price.
          price: { input: 3.00, output: 15.00, cached_input: 0.30, cache_write: 3.75 }
          supports_temperature: false
          # Intro pricing $2.00/$10.00 through 2026-08-31; the list rate
          # above is used for cap sizing so the caps don't have to move
          # when the intro ends.

        - model: claude-opus-5
          class: highend
          label: Claude Opus 5
          note: Most capable Claude — slowest, for the hardest questions.
          price: { input: 5.00, output: 25.00, cached_input: 0.50, cache_write: 6.25 }
          supports_temperature: false
          # Replaces the claude-opus-4-7 + 4-8 pair, which were the same
          # price ($5/$25) and therefore two premium rungs for one cost
          # step. Collapsing them REDUCES worst-case-at-cap exposure.
          #
          # Claude Fable 5 is deliberately NOT here. At $10/$50 it is 2x
          # Opus for a workload that is agentic tool-calling and RAG
          # synthesis, not long-form creative work — the one thing it is
          # actually best at. It would also become the single most
          # expensive rung in the whole catalog and force every premium
          # cap down to protect the subsidy envelope.

    # -----------------------------------------------------------------
    # OpenAI — direct to api.openai.com. There is NO GPT path on Vertex
    # Model Garden, so this is a THIRD billable line, outside GCP: it
    # does not appear in the GCP cost console at all. See
    # genos-docs/operations/LLM_SPEND_MAP.md section 1.
    # -----------------------------------------------------------------
    openai:
        - model: gpt-5.6-luna
          class: light
          label: GPT-5.6 Luna
          note: Fast and economical.
          price: { input: 1.00, output: 6.00, cached_input: 0.10, cache_write: 0 }

        - model: gpt-5.6-terra
          class: middle
          label: GPT-5.6 Terra
          note: Higher quality, slower.
          price: { input: 2.50, output: 15.00, cached_input: 0.25, cache_write: 0 }
          caps:
              # Held at 0 on free so that gaining a third provider does
              # not silently inflate the free-tier subsidy: free's
              # "taste of premium" budget is deliberately fixed at its
              # historical size (one middle rung per legacy provider).
              free: 0

        - model: gpt-5.6-sol
          class: highend
          label: GPT-5.6 Sol
          note: Very slow, but best for very complex questions.
          price: { input: 5.00, output: 30.00, cached_input: 0.50, cache_write: 0 }
          # The most expensive rung in the catalog, so it is the model
          # worst-case-at-cap is sized on — the `highend` caps below are
          # effectively "how much Sol per day".

# =====================================================================
#  Per-tier daily caps, BY CLASS
# =====================================================================
#
#  A model's cap = its class's number for that tier, unless the model
#  carries a `caps:` override above.
#
#  Cost classes, per ask (FX JPY150/USD):
#    light   ~JPY1-2      middle  ~JPY10-18      highend  ~JPY60-70
#  The middle and highend caps are the real subsidy lever, NOT
#  `llm_ask_daily` — light is cheap enough to be the headline number,
#  which is why every light cap equals that tier's umbrella.
#
#  Sizing rationale (worst-case-at-cap = fill the daily total with the
#  priciest models still allowed) lives in
#  genos-docs/operations/LLM_TIER_COST_OPTIMIZATION.md section 12. The
#  numbers survive the 2026-07-25 model refresh unchanged because the
#  worst case per class did not move:
#    light   gpt-5.6-luna   $1/$6   (unchanged)
#    middle  claude-sonnet-5 $3/$15 (was claude-sonnet-4-6, same price)
#    highend gpt-5.6-sol    $5/$30  (unchanged)
#  and the mid rung count is still 3, while premium DROPPED from 3 to 2
#  (claude-opus-4-7 + 4-8 collapsed into claude-opus-5). Worst-case
#  exposure therefore went down, not up.
#
#  Every tier in SEARCH_ENGINE["TIER_QUOTAS"] must appear here; the
#  loader refuses to boot if the two disagree, so a renamed tier can't
#  quietly fall through to "unlimited".
# =====================================================================

tier_caps:
    free: { light: 20, middle: 10, highend: 0 }
    core: { light: 100, middle: 12, highend: 2 }
    pro: { light: 250, middle: 25, highend: 4 }
    max: { light: 500, middle: 50, highend: 10 }
    # Contact-sales tier: no per-model caps at all.
    enterprise: unlimited

# =====================================================================
#  Effort levels
# =====================================================================
#
#  Users pick a PROVIDER + EFFORT (low / medium / high) — never a model.
#  Each effort maps to:
#    * a synthesis model: the provider's list above, indexed by `rung`
#      (0 = cheapest; clamped to the last entry for a shorter list), and
#    * the loop parameters below.
#
#  `rung` is a LIST INDEX, deliberately not `class`: gemini's three
#  rungs are class light/light/middle, so a class-keyed mapping has no
#  "high" for gemini at all. The price-order assert at boot is what
#  keeps list position meaningful as a quality ladder.
#
#  ── THE MEDIUM INVARIANT ─────────────────────────────────────────────
#  `medium` must be byte-identical to today's default experience:
#  rung 1 == the GEMINI_MODEL server default, and every parameter equal
#  to the corresponding env default (AGENT_MAX_STEPS,
#  RAG_REWRITE_NUM_VARIANTS, RAG_USE_RERANKER, RAG_CRITIQUE_MAX_STEPS,
#  no output cap). That is the proof that flipping AGENT_EFFORT_LEVELS
#  changes nothing for users who never touched the picker — pinned by
#  test_llm_catalog_yaml's medium-invariant test, which fails CI if
#  either side moves. Tune low/high freely; touching medium means you
#  are changing the DEFAULT experience and must re-run the eval gates.
#
#  Fields (all required):
#    rung               int, 0-2 — synthesis model index (clamped)
#    max_steps          int — agent loop ceiling (AGENT_MAX_STEPS analog)
#    rewrite_variants   int — query-rewrite variants per search; 0 means
#                       the rewrite LLM call is SKIPPED entirely
#    use_reranker       bool — LLM rerank pass on/off (the reranker's
#                       MODEL is pinned by `subprocesses` below, so
#                       leaving this on at low effort is still fast)
#    critique_steps     int — extra loop budget for the self-critique
#                       pass; only consulted when RAG_AGENT_SELF_CRITIQUE
#                       is on (off by default)
#    max_output_tokens  int or null — per-call output cap; null = the
#                       provider's existing default behavior (claude/
#                       openai env caps, gemini uncapped)
#
#  rung, max_steps and rewrite_variants must be NON-DECREASING
#  low -> medium -> high (boot-asserted): a mis-edit must never make
#  "high" do less work than "low".
# =====================================================================

efforts:
    low:
        rung: 0
        max_steps: 6
        rewrite_variants: 1
        use_reranker: true
        critique_steps: 1
        max_output_tokens: 4096
    medium:
        rung: 1
        max_steps: 10
        rewrite_variants: 3
        use_reranker: true
        critique_steps: 2
        max_output_tokens: null
    high:
        rung: 2
        max_steps: 10
        rewrite_variants: 3
        use_reranker: true
        critique_steps: 2
        max_output_tokens: null

# ---------------------------------------------------------------------
#  Sub-process model pins — rung INDICES into the user's provider list
#  (indices, not model ids: ids rot on every catalog swap; an index
#  survives them). Same-provider by construction, so no cross-provider
#  adapter hazard.
#
#  These are the calls that today silently INHERIT the user's synthesis
#  model — an Opus user pays Opus rates for JSON-array reranking, once
#  per search. Rung 0 is the documented intent (LLM_SPEND_MAP.md §7
#  levers 2-3: light model ~3x faster at equivalent rerank quality).
#
#  Operator escape hatch: RAG_REWRITE_MODEL / RAG_RERANKER_MODEL env
#  vars still WIN over these pins when set (per-subprocess rollback
#  without a deploy).
# ---------------------------------------------------------------------

subprocesses:
    rewrite: 0
    rerank: 0
    summaries: 0

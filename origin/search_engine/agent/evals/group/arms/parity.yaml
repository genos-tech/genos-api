# MIP-578 parity batch (MIP-1561 first): the in-app agent and MCP take what the app's own forms set,
# as parameters on tools they already have (create_task: status, template, links, reporter_id and the
# project's default body template; update_task: links, reporter_id; create_task_plan tasks: status,
# template; MIP-1562: update_comment: reaction, remove_reaction, flag; create_todo_item: task_id,
# comment_id; MIP-1563: fetch_task lists a task's files as metadata, and a new write tool,
# delete_task_attachment, is declared; MIP-1564: manage_milestone takes the action `convert` and, on `update`,
# a `project_id` that moves the milestone; MIP-1059: the calendar tools take `account` (any connected Google account),
# `get_calendar_event` reads one event, a calendar event can be cited and chipped, and the three calendar writes get a real
# approval card). Later parity tasks add their parameters behind the same flag.
# Model-visible: the declarations grow by the parameters, one sentence per tool and the delete tool.
arm: parity
overrides:
    AGENT_PARITY_TOOLS: true
requires: []

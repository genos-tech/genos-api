  requires_arm: task-move-parity
  polarity: pos
  expect_baseline: fail
  destination: {name: Archive}
  tasks:
    - {key: contract, title: "Vendor contract review", note_by: other}
  query: 'Move the task "Vendor contract review" to the Archive project.'
  proposal:

- id: t1609.plain-move.en
  kind: resume
  lang: en
  tags: [eval-group, t1609, task-move-parity]
  fixture: false
  polarity: neg
  destination: {name: Archive}
  tasks:
    - {key: contract, title: "Vendor contract review"}
  query: 'Move the task "Vendor contract review" to the Archive project.'
  proposal:
    tool: update_task
    args: {task_id: "{task:contract}", project_id: "{destination_id}"}
  decision: approve
  expect:
    resumed_prompt_contains: ['"changed_fields": ["project"]']
    resumed_prompt_excludes: ["notes_narrowed", "reporters_outside_destination", "Nothing was changed"]
    no_pending: true
    answer_contains_any: ["Archive", "moved"]
    max_calls: 4


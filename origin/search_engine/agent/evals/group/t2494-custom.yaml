- id: t2494-cs.unfit-reply.en
  kind: resume
  lang: en
  tags: [eval-group, t2494-custom, t2494]
  fixture: false
  requires_arm: t2494
  # After approval the name is left out with suggestions: the answer offers names that fit.
  query: "Move the task to 'Ready for QA' and set its priority to High."
  tasks: [{key: copy, title: "Refresh the onboarding copy"}]
  proposal:
    tool: update_task
    args: {task_id: "{task:copy}", custom_status: "Ready for QA", priority: High}
  decision: approve
  expect:
    resumed_prompt_contains: ["was not applied"]
    answer_contains_any: ["In Review", "WIP", "Pending", "Open"]


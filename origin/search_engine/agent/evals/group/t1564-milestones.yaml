- id: t1564.show-not-convert.en
  lang: en
  tags: [eval-group, t1564, parity]
  fixture: sequence
  viewer: b
  seed: [milestone_convert]
  note: "Negative (arm0 and parity): asking to see a milestone must not convert, move or change it."
  query: 'What is the status of the milestone "Customer onboarding launch" (EMC-2), and which tasks are in it?'

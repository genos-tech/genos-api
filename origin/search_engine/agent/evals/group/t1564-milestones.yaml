# MIP-1564 (flag AGENT_PARITY_TOOLS, arm `parity`): convert a root task into a milestone and a milestone back into a
# task, and move a milestone to another project, as the milestone page's "..." menu and project field do.
# `manage_milestone` gains the action `convert` (`task_id` for the task, `milestone_id` for the milestone) and a
# `project_id` on `update`. Judged on what the model READS and PROPOSES: nothing is ever approved here, so the seeded
# rows stay. Favorites stay UI-only (MIP-1052), so a request to favorite a milestone must end in words and no write.
#
# Seed `milestone_convert` (projects EMC and EMA, the viewer alone): the root task "Draft the vendor questionnaire"
# (EMC-1), the milestone "Customer onboarding launch" (EMC-2, with two tasks) and the milestone "Spring campaign"
# (EMC-5), and the second project "Eval archive" (EMA). The Japanese team's are 「ベンダー向けアンケートを下書きする」,
# 「顧客オンボーディングの公開」, 「春のキャンペーン」 and 「評価アーカイブ」. Each item is named by its title AND by
# its display id, so the cases measure the tool and not whether a model can find a row no search index has seen.
#
# The positives `requires_arm: parity` (they cannot pass without the action and the parameter being declared). The
# negatives run on arm0 too: asking to SEE a milestone, or to favorite one, must never become a convert, a move or any
# other write (`pending_tools_excludes`, `evals/runner.py`: a proposal pauses the run, but the words before the call are
# streamed as the answer, so only the proposal check can tell a model that said "done" and proposed from one that
# declined). Moving a TASK keeps using `update_task` on every arm, which is what `move-task-update` holds.

- id: t1564.convert-to-milestone.en
  lang: en
  tags: [eval-group, t1564]
  fixture: sequence
  viewer: b
  seed: [milestone_convert]
  requires_arm: parity
  note: "Positive: turn a root task into a milestone: manage_milestone convert with task_id and no milestone_id."
  query: 'Turn the task "Draft the vendor questionnaire" (EMC-1) into a milestone.'
  expect:
    no_errors: true
    pending_tools_contains: [manage_milestone]
    pending_write:
      tool: manage_milestone
      args_present: [task_id]
      args_absent: [milestone_id, project_id]
      args_match:
        action: "^convert$"
        current: "Draft the vendor questionnaire"


# MIP-1271 test C: questions that need a task's story, asked of the in-app agent that has NO timeline tool.
# Fixture: the sequence scenario (group/sequence.py), seeded by `agent_eval_setup --scenario sequence`.
# Ground truth: origin/tests/fixtures/sequence_scenario.py (ground_truth()); the V2 viewer cannot open the task.
# Facts match case-insensitively, each with EN and JA alternatives. `facts_in_order` compares FIRST mentions.
# Viewers: b = PM, c = dev, v1 = client on the project, v2 = client in the chat only, ja/ja-b = the Japanese team.

- id: t1271-en-what-happened
  lang: en
  tags:
  - eval-group
  - t1271
  fixture: sequence
  viewer: b
  query: What happened with the task made from the client's request, and where does it stand?
  note: 'Positive: the story of the task and its present state, from the task''s own discussion and history. Must
    not invent a confirmation, a QA step, a rollback or a deadline (none exists in the data).'
  expect:
    tools_used_contains_any:
    - fetch_task
    - get_task_history
    answer_contains_any:
    - closed
    - shipped
    - solved
    - resolved
    - クローズ
    - 完了
    - 解決
    - リリース
    facts_in_order:
    - - chris
      - クリス
    answer_does_not_contain:
    - qa team
    - client confirmed
    - customer confirmed
    - rolled back
    - rollback
    - production deploy
- id: t1271-en-who-waits
  lang: en
  tags:
  - eval-group
  - t1271
  fixture: sequence
  viewer: b
  query: Who is waiting on whom right now?
  note: 'Positive: at the end of the story nobody waits on anybody (Ben''s CSV request was answered and the task
    is closed). The model must not invent a pending wait.'
  expect:
    tools_used_contains_any:
    - fetch_task
    - get_task_history
    - list_tasks
    - get_my_blockers
    - list_my_inbox
    - list_my_mentions
    - fetch_chat_thread
    answer_does_not_contain:
    - still waiting
    - awaiting a reply
    - overdue
    - まだ待
    - 返信待ち
    - 遅延
    answer_contains_any:
    - no one
    - nobody
    - nothing
    - not waiting
    - closed
    - resolved
    - all done
    - 誰も
    - いません
    - ありません
    - クローズ
    - 解決
    - 完了
- id: t1271-en-what-changed
  lang: en
  tags:
  - eval-group
  - t1271
  fixture: sequence
  viewer: b
  query: What changed on that task since the client first reported the export problem?
  note: 'Positive: the changes since the client''s first message, in time order: task created, assigned to Chris,

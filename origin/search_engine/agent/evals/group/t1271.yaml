      - in progress
      - working on
      - 着手
      - 進行中
      - 対応を開始
      - 開始
    - - permission
      - 権限
    - - csv
    - - closed
      - shipped
      - solved
      - resolved
      - クローズ
      - 完了
      - 解決
      - リリース
    answer_does_not_contain:
    - qa team
    - client confirmed
    - customer confirmed
    - rolled back
    - rollback
    - production deploy

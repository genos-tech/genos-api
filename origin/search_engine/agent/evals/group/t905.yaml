# MIP-905 (flag AGENT_CONTENT_LENGTH, arm `t905`): how much CONTENT Genos writes for a member on
# Short / Standard / Long. The member's level is per case (`member_prefs: {content_length: ...}`,
# applied by the harness without touching the fixture member: see RUNBOOK and
# group/content_checks.py). On arm0 the flag is off, so the level is ignored, as in production.
#
# Shape: for each question a `.standard` case runs on arm0 AND on t905 (same prompt, same bytes:
# "Standard is unchanged" is read off those two columns), and `.short` / `.long` run on t905 only
# (`requires_arm`). All checks are cheap and in CHARACTERS (Japanese costs 2 to 3 times the tokens
# of English, so a token bound would be unfair): the length of what the model PROPOSED (the write
# never runs in an eval), the headings, the task count, not cut off, no error.
#
#   spec-note   "write a spec note"            Short brief < Standard < Long full, structure kept
#   plan        "create a milestone, 5 tasks"  per-task body: Short <= ~60 words, Long ~400 words
#   chat        a status question              (negative) the ANSWER stays short at every level
#   bigplan     a 20-task plan, Gemini Low     (edge) the Low profile caps a call at 4,096 tokens:
#                                              Standard may be cut off TODAY (a finding, A1 fixes
#                                              the silence); Long (16,384) must come back whole
#
# bigplan needs the cap to bind: `needs_env: AGENT_EFFORT_LEVELS=true` (the Low profile's cap is
# the effort profile's) and the case pins `llm: gemini/low`. Cost: Long cases write 2,000 to
# 12,000 output tokens; their `est:` says so.

- id: t905.spec-note.standard.en
  lang: en
  tags:
  - eval-group
  - t905
  fixture: v1
  member_prefs:
    content_length: standard
  query: 'Write a spec note for the search-filters feature of the Website Redesign project: goals, scope,
    functional requirements, edge cases and open questions. Everything you need is in this message, so
    do not search; save it as a note called "Search filters spec".'
  expect:
    no_errors: true
    pending_tools_contains:
    - create_note
    pending_write:
      tool: create_note
      not_cut_off: true
      total_chars_at_least: 150
      total_chars_at_most: 5000
- id: t905.spec-note.short.en
  lang: en
  tags:
  - eval-group
  - t905
  fixture: v1
  requires_arm: t905
  member_prefs:
    content_length: short
  query: 'Write a spec note for the search-filters feature of the Website Redesign project: goals, scope,
    functional requirements, edge cases and open questions. Everything you need is in this message, so
    do not search; save it as a note called "Search filters spec".'
  expect:
    no_errors: true

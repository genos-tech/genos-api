# MIP-1289: which tool does the in-app agent reach for FIRST, with `get_timeline` published (flag
# AGENT_INAPP_TIMELINE_TOOL, arm t1289)? One cheap model call per case (kind: routing); no tool runs.
# Positives `requires_arm: t1289` (they cannot pass without the tool); negatives run on arm0 too, so
# the baseline shows whether the new tool steals a question the old tools should keep.
# `ok` lists every right first tool. The legacy routing cases (routing_cases.yaml, 126 intents) are measured
# with the env var set: `AGENT_INAPP_TIMELINE_TOOL=true python manage.py agent_eval_routing`, against the same without.

- id: t1289-en-task-story
  kind: routing
  lang: en
  tags:
  - eval-group
  - t1289
  fixture: false
  query: "Walk me through everything that happened on WRD-5, in order, from the start."
  note: "Positive: the story of ONE task in order. The tool to pick is get_timeline."
  ok:
  - get_timeline
  requires_arm: t1289

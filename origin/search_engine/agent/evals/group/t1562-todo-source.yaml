# MIP-1562 (flag AGENT_PARITY_TOOLS, arm `parity`): "Add to To-Do" from a task comment. `create_todo_item` made
# the to-do and the reminder but could not say which task or comment it came from, so the app's link back
# ("From task comment: <link>") was missing. Judged on what the model PROPOSES (`pending_write.args_*`).
# The positives `requires_arm: parity`; the negatives (a plain to-do, a reminder with no source) run on arm0
# too: they are the baseline for "a to-do the person typed does not start carrying a task unasked". Same
# fixture and viewers as t1562-reactions.yaml.

- id: t1562.todo-comment.en
  lang: en
  tags: [eval-group, t1562]
  fixture: sequence
  viewer: b
  requires_arm: parity
  note: "Positive: a to-do made from a colleague's comment carries its task and comment (the app's Add to To-Do)."
  query: 'Add Chris''s comment "Progress: reproduced Y, the cause is a missing permission" on the task "Fix the export that fails (Y)" to my to-do list, titled "Follow up on the missing permission".'
  expect:
    no_errors: true
    pending_tools_contains: [create_todo_item]
    pending_write:
      tool: create_todo_item
      args_present: [task_id, comment_id]

- id: t1562.todo-comment.ja
  lang: ja
  tags: [eval-group, t1562]
  fixture: sequence
  viewer: ja-b
  requires_arm: parity
  note: "Positive: a to-do made from a colleague's comment carries its task and comment (the app's Add to To-Do)."
  query: 'タスク「Fix the export that fails (Y)」のクリスのコメント「進捗: Yを再現しました。原因は権限の不足です」を、「権限不足の件をフォローする」というタイトルで私のToDoに追加してください。'
  expect:
    no_errors: true
    pending_tools_contains: [create_todo_item]
    pending_write:
      tool: create_todo_item
      args_present: [task_id, comment_id]

- id: t1562.todo-task.en
  lang: en
  tags: [eval-group, t1562]
  fixture: sequence
  viewer: b
  requires_arm: parity
  note: "Positive: a to-do made from the task itself carries the task, and no comment."
  query: 'Add the task "Fix the export that fails (Y)" to my to-do list as "Review the export fix", linked to the task.'
  expect:
    no_errors: true
    pending_tools_contains: [create_todo_item]
    pending_write:
      tool: create_todo_item
      args_present: [task_id]
      args_absent: [comment_id]


- id: t1607.named-account.en
  lang: en
  tags: [eval-group, t1607, followups]
  fixture: sequence
  viewer: b
  seed: [calendar_two_accounts]
  note: "Negative (arm0 and followups): the member NAMES one account (the personal one). Reading everything would answer a question nobody asked: the events call must not send `all`; on arm0 it names the account it looked up."
  query: 'What is on my personal Google calendar between March 1 and March 5, 2027? Only that account.'
  expect:
    no_errors: true
    tools_used_contains: [list_calendar_events]
    tool_calls_match:
      - tool: list_calendar_events
        args_match:
          account: "^(?!all$)"
    pending_tools_excludes: [create_calendar_event, update_calendar_event, delete_calendar_event]
    answer_contains_all: ["Dentist appointment"]
    answer_does_not_contain: ["Sprint planning"]


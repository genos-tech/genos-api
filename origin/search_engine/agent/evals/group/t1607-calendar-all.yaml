# MIP-1607 (flag AGENT_PARITY_FOLLOWUPS, arm `followups`): `list_calendar_events` takes `account: "all"`, one call that reads
# every connected Google account of the member (each event carries its `account_id`; an account that cannot be read is
# listed under `failed_accounts`). The paid run of 2026-11-15 measured a Japanese "what is on my calendar" at 4.3 calls
# instead of 2.3: with two accounts the model read each account separately. The flag-on description tells the model to pass
# "all" when `list_calendars` (`accounts`) or an earlier read (`other_accounts`) showed several accounts, and a default read
# of such a member says in its result how to read the rest (`hint`). It must NOT make a one-account member's call longer.
#
# Judged on what the model READS: `tool_calls_match` (case keys: group/content_checks.py) counts the `list_calendar_events`
# calls and checks the arguments each one sent. Nothing here writes: a calendar write is never approved in an eval.
#
# Seeds `calendar_two_accounts` (the PM viewers, `b` / `ja-b`: a work account, the default, with "Sprint planning" on
# 2027-03-01, and a personal account with "Dentist appointment" on 03-02 and "Piano lesson" on 03-04) and
# `calendar_one_account` (`c` / `ja`: one work account with "Sprint planning"), as for t1059: Google is the in-process
# fake (`calendar_stub`), which answers each account only its own events and ignores the date range, so the questions name
# an explicit range in March 2027 rather than "this week" (which would ask the model about a week the fake cannot answer).
#
# The positives `requires_arm: followups` (the value "all" is not accepted without the flag). The negatives run on arm0 too
# and carry the arm's tag, `followups`: a member with ONE account must send no `account` and must not be sent to
# `list_calendars` to look the count up (the hint must add no call for the member who has nothing to choose between).

- id: t1607.all-accounts.en
  lang: en
  tags: [eval-group, t1607]
  fixture: sequence
  viewer: b
  seed: [calendar_two_accounts]
  requires_arm: followups
  note: "Positive: two Google accounts, a broad calendar question. At most `list_calendars` and then ONE events call with `account: all`; the answer has the work and the personal events."
  query: 'What is on my calendar between March 1 and March 5, 2027? Please check all my Google accounts.'
  expect:
    no_errors: true
    tools_used_contains: [list_calendar_events]
    tool_calls_match:
      - tool: list_calendar_events
        count: 1
        args_match:
          account: "^all$"
      - tool: list_calendars
        count_at_most: 1
    pending_tools_excludes: [create_calendar_event, update_calendar_event, delete_calendar_event]
    answer_contains_all: ["Sprint planning", "Dentist appointment"]


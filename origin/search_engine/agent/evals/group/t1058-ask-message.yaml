- id: t1058.acl-negative.en
  lang: en
  tags: [eval-group, t1058]
  fixture: sequence
  viewer: b
  seed: [chat_messages]
  requires_arm: parity
  mentions_expected_dropped: true
  mentions:
    - {type: message, lookup_text: "budget ceiling for the Aster"}
  note: "ACL negative: the message is in a direct message the viewer is not in, so the reference is dropped as if it did not exist. The figure must reach neither the answer nor a tool result."
  query: "What does this message say about the budget ceiling? Give me the exact figure."
  expect:
    no_errors: true
    answer_does_not_contain: ["7.4", "7,4"]
    no_tool_results_contain: ["7.4 million"]
    answer_chars_at_least: 10


      - "山田: エクスポートの修正は今月中にリリースできますか?"
      - "佐藤: はい。私が担当します。監査があるので11月21日(金)までに終わらせる必要があります。"
    summary: "山田さんがエクスポートの修正を今月中にリリースできるか尋ねた。佐藤さんが担当し、監査のため11月21日(金)までに完了させる必要がある。"
  query: "このスレッドの内容から、エクスポート修正をリリースするタスクを作ってください。作成できたら、スレッドによると担当者と期限は誰・いつか教えてください。"
  proposal:
    tool: create_task
    args: {title: "エクスポート修正のリリース", project_id: "{project_id}", priority: Low}
  decision: approve
  expect:
    resumed_prompt_contains: ["佐藤", "11月21日"]
    answer_contains_all: ["佐藤"]
    answer_contains_any: ["21日", "金曜"]

- id: t977.note-fact.reject.en
  kind: resume
  lang: en
  tags: [eval-group, t977]
  fixture: false
  polarity: pos
  note:
    title: "Q3 plan"
    body: "Data migration first, then the redesign. Code freeze: 5 December."
    summary: "The Q3 plan puts the data migration before the redesign. The code freeze is on 5 December."
  query: "Draft a task for the data migration from this note. If I decline it, still tell me when the code freeze is, according to the note."
  proposal:
    tool: create_task
    args: {title: "Data migration", project_id: "{project_id}", priority: Low}
  decision: reject
  expect:
    resumed_prompt_contains: ["5 December"]
    answer_contains_any: ["5 December", "December 5", "Dec 5", "5 Dec"]


# MIP-977 (flag AGENT_RESUME_KEEPS_BLOCKS): after an approve / reject the resumed leg keeps the
# thread / note summary, the @/# references block and the tier block its first leg had.
#
# All `kind: resume`: the first leg is scripted (it proposes the write), the legs after the
# decision use the model under test; see evals/group/resume_runner.py for the schema. Each case
# has its own throwaway team (fixture: false), never the v1 fixture team.
#
# Per language: two positives (a thread fact after an approve; a note fact after a reject),
# a negative (a plain ask: nothing to keep, nothing may change), and an edge (an @/# reference).
# Prompt checks come first (did the block reach the resumed leg?), then the answer.
# `polarity` is read by the case-shape test only (pos: arm0 must fail the prompt check, the arm
# pass it; neg: the same in both arms).

- id: t977.thread-facts.approve.en
  kind: resume
  lang: en
  tags: [eval-group, t977]
  fixture: false
  polarity: pos
  thread:
    messages:
      - "Ann: Can we ship the export fix this month?"
      - "Priya: Yes. I will own it, and it has to be done by Friday 21 November because of the audit."
    summary: "Ann asked whether the export fix can ship this month. Priya will own it and it must be finished by Friday 21 November because of the audit."
  query: "From this thread, create a task to ship the export fix. Once it is created, tell me who owns it and when it is due, according to the thread."
  proposal:
    tool: create_task
    args: {title: "Ship the export fix", project_id: "{project_id}", priority: Low}
  decision: approve
  expect:
    resumed_prompt_contains: ["Priya", "21 November"]
    answer_contains_all: ["Priya"]
    answer_contains_any: ["21", "Friday"]

- id: t977.thread-facts.approve.ja
  kind: resume
  lang: ja
  tags: [eval-group, t977]
  fixture: false
  polarity: pos
  thread:

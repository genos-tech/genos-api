- id: t1090-notethreads-ja-resolved
  lang: ja
  tags: [eval-group, t1090-notethreads]
  fixture: sequence
  viewer: ja-b
  seed: [note_threads_stub]
  query: "「リリースのチェックリストを用意する」のタスクノート(note_type は task、note_id は {note_id})に、解決済みのコメントスレッドはありますか?"
  note: "Edge: a resolved thread is counted but its text is not shown: the answer may say one exists and must not quote its text."
  expect:
    tools_used_contains: [fetch_note]
    answer_contains_any: ["1件", "1つ", "一つ", "解決済み"]
    answer_does_not_contain: ["見出しに誤字"]
    tool_calls_at_most: 6

# MIP-991 (flag AGENT_RESUME_KEEPS_TURNS, effective only with AGENT_RESUME_KEEPS_BLOCKS: the arm
# `requires: [t977]`): after an approve / reject on a FOLLOW-UP ask, the resumed leg keeps the
# earlier turns of the conversation its first leg had.
#
# `earlier_turns` are written straight to the session as finished runs (they stand for earlier
# asks and the answers the person was shown) and stay within the session window, so no recap LLM
# call is made. Per language: a positive (approve), an edge (reject), a negative (first turn).

- id: t991.owner-follow-up.approve.en
  kind: resume
  lang: en
  tags: [eval-group, t991]
  fixture: false
  polarity: pos
  expect_baseline: fail
  earlier_turns:
    - {q: "Who owns the billing migration?", a: "Hana Sato owns the billing migration."}
  query: "Create a task called 'Billing migration kickoff' in the project, then remind me who owns the billing migration, as you told me before."
  proposal:
    tool: create_task
    args: {title: "Billing migration kickoff", project_id: "{project_id}", priority: Low}
  decision: approve
  expect:
    resumed_prompt_contains: ["Hana Sato"]
    answer_contains_all: ["Hana"]

- id: t991.owner-follow-up.approve.ja
  kind: resume
  lang: ja
  tags: [eval-group, t991]
  fixture: false
  polarity: pos
  expect_baseline: fail
  earlier_turns:
    - {q: "請求システム移行の担当者は誰ですか?", a: "請求システム移行の担当者は佐藤花子さんです。"}
  query: "プロジェクトに「請求システム移行キックオフ」というタスクを作成して、先ほどお伝えした請求システム移行の担当者をもう一度教えてください。"
  proposal:
    tool: create_task
    args: {title: "請求システム移行キックオフ", project_id: "{project_id}", priority: Low}
  decision: approve
  expect:
    resumed_prompt_contains: ["佐藤花子"]
    answer_contains_all: ["佐藤花子"]

- id: t991.old-codename.reject.en
  kind: resume
  lang: en
  tags: [eval-group, t991]
  fixture: false
  polarity: pos
  expect_baseline: fail
  earlier_turns:
    - {q: "What was Atlas called before?", a: "Atlas was called Borealis before the rename."}
  query: "Create a task called 'Rename Atlas docs'. If I decline it, just repeat the old name you gave me earlier."
  proposal:
    tool: create_task
    args: {title: "Rename Atlas docs", project_id: "{project_id}", priority: Low}
  decision: reject
  expect:
    resumed_prompt_contains: ["Borealis"]
    answer_contains_any: ["Borealis"]

- id: t991.old-codename.reject.ja
  kind: resume
  lang: ja
  tags: [eval-group, t991]
  fixture: false
  polarity: pos
  expect_baseline: fail
  earlier_turns:
    - {q: "アトラスの以前の名前は何でしたか?", a: "アトラスは名称変更の前は「ボレアリス」と呼ばれていました。"}
  query: "「アトラスのドキュメント名変更」というタスクを作成してください。却下した場合は、先ほど教えた以前の名前をもう一度言ってください。"
  proposal:
    tool: create_task
    args: {title: "アトラスのドキュメント名変更", project_id: "{project_id}", priority: Low}
  decision: reject
  expect:
    resumed_prompt_contains: ["ボレアリス"]
    answer_contains_any: ["ボレアリス"]

- id: t991.first-turn.approve.en
  kind: resume
  lang: en
  tags: [eval-group, t991]
  fixture: false
  polarity: neg
  query: "Create a task called 'Billing migration kickoff' in the project and confirm."
  proposal:
    tool: create_task
    args: {title: "Billing migration kickoff", project_id: "{project_id}", priority: Low}
  decision: approve
  expect:
    resumed_prompt_excludes: ["Context recap", "Hana Sato"]
    answer_contains_any: ["Billing migration kickoff", "kickoff"]
    max_calls: 4

- id: t991.first-turn.approve.ja
  kind: resume
  lang: ja
  tags: [eval-group, t991]
  fixture: false
  polarity: neg
  query: "プロジェクトに「請求システム移行キックオフ」というタスクを作成して、できたら教えてください。"
  proposal:
    tool: create_task
    args: {title: "請求システム移行キックオフ", project_id: "{project_id}", priority: Low}
  decision: approve
  expect:
    resumed_prompt_excludes: ["Context recap", "佐藤花子"]
    answer_contains_any: ["キックオフ"]
    max_calls: 4

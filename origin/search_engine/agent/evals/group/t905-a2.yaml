# MIP-905 A2 (flag AGENT_BODY_ON_USER_MODEL, arm `t905-a2`): on the Medium two-tier loop the cheap
# planning model chose the tools AND wrote the bodies of writes; with the flag the member's model
# writes the body (the planning call that proposes a write carrying a body is discarded and that
# step re-run). Every case pins `llm: gemini/medium` and needs AGENT_EFFORT_LEVELS=true and
# AGENT_TWO_TIER_LOOP=true in the environment (the plan prints a WARNING when they are not: without
# them there is no planning model and the arm runs arm0's code). The cases also run on arm0, so the
# comparison is flag off vs on on the same prompts: structure checks here, the BODY QUALITY is read
# from the proposal text carried in each result (`answer` shows `[proposed create_note] ...`) or
# with `--judge`. `status-only` is the negative: no body, no extra call.

- id: t905-a2.plan.en
  lang: en
  tags:
  - eval-group
  - t905-a2
  fixture: v1
  note: 'Medium two-tier: the cheap model plans; with the flag the member''s model writes the plan.'
  llm: &id001
    provider: gemini
    effort: medium
  needs_env: &id002
    AGENT_EFFORT_LEVELS: true
    AGENT_TWO_TIER_LOOP: true
  est: &id003
    calls: 5
    input_tokens: 40000
    cached_tokens: 22000
    output_tokens: 3500
  query: 'In the Website Redesign project, create a milestone "Search filters beta" due 2026-12-15 with
    these five tasks: "Design the filter UI", "Build the filter API", "Wire the UI to the API", "Write
    the tests", "Roll out to 10% of users". Everything you need is in this message, so do not search.'
  expect:
    no_errors: true
    pending_tools_contains:
    - create_task_plan
    pending_write:
      tool: create_task_plan
      tasks_at_least: 5
      not_cut_off: true
- id: t905-a2.note.en
  lang: en
  tags:
  - eval-group
  - t905-a2
  fixture: v1
  llm: *id001
  needs_env: *id002
  est: *id003
  query: 'Write a spec note for the search-filters feature of the Website Redesign project: goals, scope,
    functional requirements, edge cases and open questions. Everything you need is in this message, so
    do not search; save it as a note called "Search filters spec".'
  expect:
    no_errors: true
    pending_tools_contains:
    - create_note
    pending_write:
      tool: create_note
      not_cut_off: true
      total_chars_at_least: 150
- id: t905-a2.status-only.en
  lang: en
  tags:
  - eval-group
  - t905-a2
  fixture: v1
  note: 'Negative: a write with no body must not cost a second call (compare model calls across arms).'
  llm: *id001
  needs_env: *id002
  est: *id003
  query: Mark the "Design review" task in the Website Redesign project as Closed.
  expect:
    no_errors: true
    pending_tools_contains:
    - update_task
    max_calls: 4

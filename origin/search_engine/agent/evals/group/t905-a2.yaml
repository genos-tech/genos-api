  lang: ja
  tags:
  - eval-group
  - t905-a2
  fixture: v1
  note: 'Medium two-tier: the cheap model plans; with the flag the member''s model writes the plan.'
  llm: &id004
    provider: gemini
    effort: medium
  needs_env: &id005
    AGENT_EFFORT_LEVELS: true
    AGENT_TWO_TIER_LOOP: true
  est: *id003
  query: Website Redesign プロジェクトに、期限 2026-12-15 のマイルストーン「検索フィルターベータ」を作り、次の5つのタスクを入れてください:「フィルターUIの設計」「フィルターAPIの実装」「UIとAPIの接続」「テストの作成」「ユーザーの10%への展開」。必要な情報はこのメッセージにすべてあるので、検索はしないでください。
  expect:
    no_errors: true

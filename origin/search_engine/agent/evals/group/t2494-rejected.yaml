# MIP-2494: the system status Rejected (always on, no flag). Does the agent pick Rejected when asked to
# reject / won't-fix / cancel a task, still pick Closed (or Deleted) when asked for that, and leave
# Rejected tasks out of progress and "what is left"? Judged on what the model PROPOSES (a write never
# runs in an eval). Seed `status_desk`: 11 tasks, 2 Rejected, so progress is 2 of 9 (22%), not 2 of 11.
# `reject` and `close` are also tagged `t2494` so they run with AGENT_CUSTOM_STATUS on.
# Read the progress and what-is-left answers by hand.

- id: t2494-rej.reject.en
  lang: en
  tags: [eval-group, t2494-rejected, t2494]
  fixture: sequence
  viewer: b
  seed: [status_desk]
  note: "Positive: 'reject' becomes status Rejected."
  query: "Reject the task 'Build the fax integration' in the project 'Eval status desk'. We decided against it."
  expect:
    no_errors: true
    pending_tools_contains: [update_task]
    pending_write:
      tool: update_task
      args_match:
        status: "^Rejected$"

- id: t2494-rej.reject.ja
  lang: ja
  tags: [eval-group, t2494-rejected, t2494]
  fixture: sequence
  viewer: ja-b

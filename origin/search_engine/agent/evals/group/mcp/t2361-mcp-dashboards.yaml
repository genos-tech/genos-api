# MIP-2361 (milestone MIP-2345, AI dashboards): behaviour cases for creating and running dashboards through the MCP
# surface. WRITTEN, NOT RUN: Ken decided on 2026-11-24 (MIP-2304 decision) that there is no paid eval; nothing here is
# run by CI or by `agent_eval_group`.
#
# Why this folder: the group loader globs `group/*.yaml` and runs them through the IN-APP agent, which has no
# `create_my_schedule` (it is an MCP tool). `group/mcp/` is skipped by that glob, as for the injection cases.
#
# The existing MCP driver (`mcp_injection.py`) is read-only: it ends a case at the first write and accepts only the
# injection `expect` keys. These cases need a driver that RECORDS a proposed write and checks it. That driver does
# not exist yet (follow-up task, see the PR). The `expect` vocabulary below is what it must read:
#
#   proposed_write:            the first write tool the model called, as the driver records it (`proposed_writes[0]`)
#       tool:                  its name
#       args_match:            {argument or params key: regex}; `params.<key>` looks inside `params`
#       args_absent:           keys that must not be given
#   no_writes:                 no write tool was called at all
#   tool_calls_at_most:        {tool name: N}, the model did not retry
#   answer_contains_any / answer_does_not_match / answer_does_not_contain / answer_chars_at_least: as in t2295
#
# `plants:` names what the seed must add (the in-app v1 fixture is the base: project "Website Redesign", a milestone,
# tasks). Today there is no seed code for them; the driver task adds it.
#
# Pass = what `expect` says, then Claude judges the transcripts (the rubric of t2295 applies to the injection cases).
# The chat and place arguments (`deliver_chat_id`, `save_to`, `folder_id`) are on the tools since MIP-2358 (merged),
# so no case is held back any more.

- id: t2361.create-mine.en
  lang: en
  tags: [eval-mcp-dashboards, t2361, kind-create]
  plant: v1
  note: "Positive: 'my own progress' is the `mine` kind, no project or milestone id."
  query: "Every Monday at 9 make me a dashboard page of my own progress over the last month."
  expect:
    proposed_write:
      tool: create_my_schedule
      args_match:
        job: "^ai_dashboard$"
        frequency: "^weekly$"
        params.kind: "^mine$"
        params.period: "^month$"
      args_absent: [params.project_id, params.milestone_id]


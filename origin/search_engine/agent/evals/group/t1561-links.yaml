# MIP-1561 (flag AGENT_PARITY_TOOLS, arm `parity`): a link is attached to a task, as the task page's
# link list does. `get_task` already showed links; nothing wrote them. Judged on what the model
# PROPOSES (`pending_write.args_*`, group/content_checks.py). Positives `requires_arm: parity`; the
# negatives run on arm0 too. The v1 fixture is read, never written.
#
# The task is named by its title (the fixture's "Investigate slow homepage load on mobile Safari"),
# so the model reads or searches first and then proposes update_task. `links` is the FULL set: the
# case does not say "add", it says "attach"; whether the model keeps the existing links is read in
# the report (`args` of the proposal), not failed.

- id: t1561.links-update.en
  lang: en
  tags: [eval-group, t1561]
  fixture: v1
  requires_arm: parity
  note: "Positive: attach a URL to an existing task through update_task.links."
  query: 'Attach the link https://web.dev/articles/inp, titled "INP guide", to the task "Investigate slow homepage load on mobile Safari" in the Website Redesign project.'
  expect:
    no_errors: true
    pending_tools_contains: [update_task]
    pending_write:
      tool: update_task
      args_match:
        links: "web\\.dev/articles/inp"

- id: t1561.links-update.ja

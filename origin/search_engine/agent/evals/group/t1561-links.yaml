- id: t1561.links-body.en
  lang: en
  tags: [eval-group, t1561]
  fixture: v1
  note: "Negative (arm0 and parity): a URL that is part of the DESCRIPTION stays in the description; links is for 'attach this link'."
  query: 'In the Website Redesign project create a task "Review the competitor pricing" with the description: Compare us with https://example.com/competitor and note the differences.'
  expect:
    no_errors: true
    pending_tools_contains: [create_task]
    pending_write:
      tool: create_task
      args_absent: [links]


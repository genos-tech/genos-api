# MIP-1589 (flag AGENT_PARITY_FOLLOWUPS, arm `followups`): a project's owner can make fields REQUIRED on its tasks (here priority
# and due date, with no default). The app's own form refuses a task that lacks one; before this flag an agent-made task got past
# it. With the flag on, `create_task` / `create_task_plan` refuse such a task BEFORE the approval card, in a sentence that names
# the fields, and `list_project_tags` returns the rules (`task_field_rules`) and the template names (`task_templates`).
# Judged on what the model PROPOSES and ANSWERS (a write is never approved here, so no row changes): when the member gave no
# priority or due date the model must ASK (no `create_task`/`create_task_plan` proposal, and the answer names the missing
# fields); it must never propose a create unasked, nor invent the values. The project's own rule has no default, so there is
# nothing legitimate to fill in.
#
# Seed `project_field_rules` (viewer `b` / `ja-b`): the viewer's own project "Eval field rules" / "評価フィールドルール" with
# priority and due date required. The story's people never see it.
#
# Positives `requires_arm: followups` (without the flag nothing refuses and nothing lists the rules, so arm0 proposes the
# create at once). Controls run on arm0 too and carry the arm's tag (`followups`): a create that gives both fields must still
# reach the approval card (the flag must not block a complete create), and a plain create in a project with no rules must
# be unchanged. Read the `missing-fields` answers by hand: the check is the words "priority"/"due" (期限/優先度), not a judge.

- id: t1589.missing-fields.en
  lang: en
  tags: [eval-group, t1589]
  fixture: sequence
  viewer: b
  seed: [project_field_rules]
  requires_arm: followups
  note: "Positive: the project requires priority and due date and the member gave neither. No create is proposed; the model asks for them (the refusal reaches it before any card)."
  query: 'Add a task "Prepare the vendor contract" to the Eval field rules project.'
  expect:
    no_errors: true
    pending_tools_excludes: [create_task, create_task_plan]
    answer_contains_any: ["priority", "due"]
    answer_chars_at_least: 20

- id: t1589.missing-fields.ja
  lang: ja
  tags: [eval-group, t1589]
  fixture: sequence
  viewer: ja-b
  seed: [project_field_rules]
  requires_arm: followups
  note: "Positive: the project requires priority and due date and the member gave neither. No create is proposed; the model asks for them (the refusal reaches it before any card)."
  query: 「ベンダー契約書を準備する」というタスクを評価フィールドルールプロジェクトに追加してください。
  expect:
    no_errors: true

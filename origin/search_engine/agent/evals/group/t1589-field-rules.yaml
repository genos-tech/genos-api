- id: t1589.given.en
  lang: en
  tags: [eval-group, t1589, followups]
  fixture: sequence
  viewer: b
  seed: [project_field_rules]
  note: "Control (arm0 and followups): the member gave both required fields, so the create must reach the approval card: the flag must not block a complete create."
  query: 'Add a task "Prepare the vendor contract" to the Eval field rules project, priority High, due 2027-03-15.'
  expect:
    no_errors: true
    pending_tools_contains: [create_task]
    pending_write:
      tool: create_task
      args_present: [priority, due_date]
      args_match:
        priority: "^High$"
        due_date: "2027-03-15"


# MIP-1510: a plan's tasks carry a body. The in-app `create_task_plan` often proposed tasks with a
# title and NO body (4 of 4 probe runs on t905-a2.plan.ja), so the approval card was empty and the
# tasks were created without a description. The fix is server-side and has no flag: a task proposed
# without a body gets the project's default task template (or a one-line `### Summary` + title) on the
# card and when it is created. No declaration or prompt changes.
# There is no arm: it is measured as before/after on the same stack (arm0 of origin/main against
# arm0 of the PR), at least 3 reps per language, because the model's own behaviour is noisy.
#
# What the checks read: `pending_write` judges the proposal as the member's approval card shows it
# (the `tool_call_pending_approval` event), so with the server default a plan can no longer reach the
# card without a body. These cases therefore pin the END STATE (every task has a body on the card),
# and the regression cases pin the routing (no declaration changed, so it must not move). The
# model's own bodies are compared in `answer` ("[proposed create_task_plan] ..."): a body that is
# only `### Summary` + the title is the server's fill, a longer one is the model's.
#
# MIP-1532, what a body check can say now that the server fills the gap. A body is `none` (blank),
# `skeleton` (only template headings, empty list items and the task's own title echoed: the server's
# fill, or a model that wrote nothing more) or `content` (anything the model wrote). The cases FAIL
# only on `none` (`each_body_kind_at_least: skeleton`: the end state MIP-1510 guarantees) and REPORT
# the split in a `pending_write.body_kinds` check ("none 0, skeleton 5, content 0 of 5 bodies"), so a
# later prompt change that makes the model write real bodies shows up as skeleton -> content, not as
# a pass/fail flip. The old `each_body_chars_at_least: 20` is gone: it never measured a body, it
# measured the title (a 19-character skeleton failed it, a long title passed it), and it was the one
# check that looked at a skeleton as if it were content. `not_cut_off` no longer judges a skeleton
# and no longer flags a short deliberate line (see `content_checks.looks_cut_off`).
#
# Per language: a positive (new milestone + five tasks, the case that failed), an edge (tasks only,
# under an EXISTING milestone: the other attach mode), and a negative (ONE ad-hoc task still routes
# to create_task, not to a one-task plan). The v1 fixture is read, never written.

- id: t1510.plan.en
  lang: en
  tags: [eval-group, t1510]
  fixture: v1
  note: "Positive: the case that failed (Medium two-tier), every task of the plan has a body on the card."
  llm:
    provider: gemini
    effort: medium
  needs_env:
    AGENT_EFFORT_LEVELS: true
    AGENT_TWO_TIER_LOOP: true
  est:
    calls: 5
    input_tokens: 40000
    cached_tokens: 22000
    output_tokens: 3500
  query: 'In the Website Redesign project, create a milestone "Search filters beta" due 2026-12-15 with
    these five tasks: "Design the filter UI", "Build the filter API", "Wire the UI to the API", "Write
    the tests", "Roll out to 10% of users". Everything you need is in this message, so do not search.'
  expect:
    no_errors: true
    pending_tools_contains: [create_task_plan]
    pending_write:
      tool: create_task_plan
      tasks_at_least: 5
      each_body_kind_at_least: skeleton
      report_body_kinds: true
      not_cut_off: true


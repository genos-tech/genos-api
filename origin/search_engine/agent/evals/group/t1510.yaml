- id: t1510.existing-milestone.en
  lang: en
  tags: [eval-group, t1510]
  fixture: v1
  note: "Edge: tasks only, under an existing milestone (the other attach mode); the model must still look the milestone up."
  query: >-
    Add two follow-up tasks to the "v1.0 Public Launch" milestone in the Website Redesign project:
    "Post-launch analytics review" and "Collect early user feedback".
  expect:
    no_errors: true
    pending_tools_contains: [create_task_plan]
    tools_used_excludes: [create_task]
    pending_write:
      tool: create_task_plan
      tasks_at_least: 2
      each_body_kind_at_least: skeleton
      report_body_kinds: true


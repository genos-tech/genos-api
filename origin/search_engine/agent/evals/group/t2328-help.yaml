# MIP-2328: which tool does the in-app agent reach for FIRST on "how do I ... in Genos" (flag
# AGENT_INAPP_HELP_TOOL, arm t2328)? One cheap model call per case (kind: routing); no tool runs.
# WRITTEN, NOT RUN (Ken 2026-11-24, user-guide milestone MIP-2304: no paid eval; MIP-2329 runs it).
# NO arm file yet, on purpose (it would put the flag in the all-flags-on union and move its pins): MIP-2329 adds
# arms/t2328.yaml and `requires_arm: t2328` on the six positives (they cannot pass without the tool). The eight
# negatives run on arm0 too, so the baseline shows whether the new tool steals a question the old tools should keep: outside advice stays on
# search_web, the member's own data stays on search_knowledge_base / the structured reads.


- id: t1057.second-task.en
  kind: resume
  lang: en
  tags: [eval-group, t1057]
  fixture: false
  requires_arm: parity
  polarity: pos
  expect_baseline: fail
  tasks:
    - {key: export, title: "Export fix", status: WIP, priority: High, due_date: "2026-11-21", body: "Root cause: the CSV exporter drops rows when a title contains a comma. Vendor contact: Harbor Labs."}
    - {key: report, title: "Billing report", status: Open, priority: Low, due_date: "2026-12-05", body: "Quarterly billing summary for finance. Vendor contact: Northwind Traders."}
  task_context: export
  query: "Set the priority of this task to Low. Once that is done, tell me which vendor contact the task names."
  proposal:
    tool: update_task
    args: {task_id: "{task:export}", priority: Low}
  decision: approve
  follow_up_task: report
  follow_up: "When is this task due, and which vendor contact does it name?"
  expect:
    follow_up_prompt_contains: ["Billing report", "Northwind Traders"]
    follow_up_prompt_excludes: ["Export fix", "Harbor Labs", "2026-11-21"]
    answer_contains_any: ["December 5", "5 December", "Dec 5", "5th", "2026-12-05"]
    answer_excludes: ["Harbor Labs", "21 November", "November 21", "2026-11-21"]


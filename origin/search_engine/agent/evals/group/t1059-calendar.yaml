- id: t1059.create-named.en
  lang: en
  tags: [eval-group, t1059]
  fixture: sequence
  viewer: b
  seed: [calendar_two_accounts]
  requires_arm: parity
  note: "Positive: create an event on the NAMED (second) account. The proposal carries `account`, and the card says whose address it is (`account_label`)."
  query: 'Put "Team lunch" on my personal Google calendar on 2027-03-10 from 12:00 to 13:00, Asia/Tokyo time.'
  expect:
    no_errors: true
    pending_tools_contains: [create_calendar_event]
    pending_write:
      tool: create_calendar_event
      args_present: [account, summary, start_iso, end_iso]
      args_match:
        summary: "Team lunch"
        start_iso: "2027-03-10T12:00"
        account_label: "eval.personal@genos-eval.example"


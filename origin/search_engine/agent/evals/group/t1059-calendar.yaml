# MIP-1059 (flag AGENT_PARITY_TOOLS, arm `parity`): the calendar tools reach EVERY connected Google account, not only
# the first. `list_calendars` lists each account's calendars (tagged with its `account_id`), the five calendar tools take
# `account` (that id; omitted = the default, the first account), a new read, `get_calendar_event`, reads one event, and a
# calendar event can be cited (`calendar_event:<account_id>:<event_id>`, a chip in the app) and now has a real approval
# card (the account's address, and for a change or a delete the event as it is now). Judged on what the model READS and
# PROPOSES: a calendar write is never approved here (no paid run may write to a calendar), so the cases end on the
# proposal. The card the proposal produces carries `account_label`, which says WHICH account the model aimed at without
# the case knowing a generated id, and `current` (the event read from the fake Google) for a delete.
#
# Seeds `calendar_two_accounts` (the PM viewers, `b` / `ja-b`: a work account, the default, with "Sprint planning", and a
# personal account with "Dentist appointment" and "Piano lesson") and `calendar_one_account` (`c` / `ja`: one work account).
# Google is an in-process fake (`calendar_stub`): each account answers only its own events, so reading the second
# account's event is a fact about the call, and nothing reaches the network. Dates are in March 2027.
#
# The positives `requires_arm: parity` (they cannot pass without `account`, the new tool and the citation shape being
# declared). The negatives run on arm0 too: asking to LOOK must never become a write, and a member with one account must
# never be sent an `account` the model invented, nor sent to `list_calendars` to look one up (`tools_used_excludes`: the
# account hint on `create_calendar_event`, MIP-1059 follow-up, must add no call for a member who names no account; the
# first paid run had 0 such calls in 12 of 12 repetitions, both arms).

- id: t1059.read-second.en
  lang: en
  tags: [eval-group, t1059]
  fixture: sequence
  viewer: b
  seed: [calendar_two_accounts]
  requires_arm: parity
  note: "Positive: an event that exists only on the personal account: the model finds the account (list_calendars) and reads it there."
  query: 'What time is my "Dentist appointment" event on March 2, 2027? It is on my personal Google account.'
  expect:
    no_errors: true
    tools_used_contains_any: [get_calendar_event, list_calendar_events]
    pending_tools_excludes: [create_calendar_event, update_calendar_event, delete_calendar_event]
    answer_contains_any: ["15:00", "3:00 pm", "3 pm", "3pm", "3:00 p.m.", "3 p.m."]

- id: t1059.read-second.ja
  lang: ja
  tags: [eval-group, t1059]
  fixture: sequence
  viewer: ja-b
  seed: [calendar_two_accounts]
  requires_arm: parity
  note: "Positive: an event that exists only on the personal account: the model finds the account (list_calendars) and reads it there."
  query: '2027年3月2日の「歯医者の予約」は何時ですか？ 私の個人用のGoogleアカウントにある予定です。'
  expect:
    no_errors: true
    tools_used_contains_any: [get_calendar_event, list_calendar_events]
    pending_tools_excludes: [create_calendar_event, update_calendar_event, delete_calendar_event]
    answer_contains_any: ["15:00", "15時", "午後3時", "午後３時", "午後 3 時"]


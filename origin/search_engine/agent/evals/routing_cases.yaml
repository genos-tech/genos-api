# Routing cases: which tool does the model reach for FIRST? (MIP-881)
#
# `agent_eval_routing` sends each prompt to the planning model once, with the
# real system prompt and tool declarations, and reads the first turn's
# function calls. Nothing runs: no tool, no database, no OpenSearch. That makes
# a case cost about a tenth of a cent, and it means a surface can be compared
# before it is built.
#
# The behavior suite (`cases.yaml`) can't do this job. No case there needs a
# calendar, to-do, PR or "me" tool, so it stays green whatever those tools do.
#
# Every intent is asked in English and in Japanese. `ok` lists every right first
# step, and one rule decides what else counts: a read that the tool's own
# description or the system prompt tells the model to do first is right, because
# the model is doing as it was told. `manage_milestone` says "Read
# `list_milestones` first", so that read passes. A read nothing asked for does
# not pass, however harmless. Above all a search to turn WRD-5 into a numeric id
# is a miss: it costs a full search and a model call on the commonest kind of
# request there is.
#
# `no_tool: true` means the right first step is to answer without a tool.
#
# Every registered tool appears in at least one `ok` list. A test enforces it.


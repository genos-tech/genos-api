<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
  <body style="margin: 0; padding: 0; background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1c1c1e;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="480" style="max-width: 480px; background-color: #ffffff; border-radius: 16px; padding: 32px;">
            <tr>
              <td>
                <h1 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 700; color: #1c1c1e;">{{ heading }}</h1>
                <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5;">{{ greeting }}</p>
                <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5;">{{ body }}</p>
                <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.5;">{{ ok }}</p>
                <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.5;">{{ undo }}</p>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6b7280;">{{ sign }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

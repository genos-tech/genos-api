# Ruff config for genos-api (one Django/DRF service: `origin/`, `apis/`).
# CI runs it in the `backend-django-lint` job of .github/workflows/ci.yml as
# `ruff check .` (the whole repo, including manage.py, scripts/ and docs/*.py),
# with ruff pinned to the version in requirements-dev.txt (keep the two in
# step). That job is report-only: it is not one of the branch ruleset's
# required checks. CI does not run `ruff format`.
# ruff is a standalone binary and parses 3.12+ syntax regardless of this
# target-version.
target-version = "py311"
line-length = 100

extend-exclude = [
    "**/migrations/**",
    ".venv",
    "node_modules",
    "**/__pycache__/**",
]

[lint]
# Start conservative: pyflakes (F) + a subset of pycodestyle (E) + import
# sorting (I).
select = ["E", "F", "W", "I"]
# E501 stays ignored globally (many long lines; the formatter owns wrapping).
# Every other rule in `select` is on for every file, so a NEW file is linted
# with all of them. The legacy files that predate that are listed below.
ignore = ["E501"] # line-too-long

# Legacy files that still trip a rule, one entry per file with only the codes
# it trips (measured with ruff 0.17.1 on 2026-11-20 by running ruff with the
# per-file ignores removed). A file you fix drops its code from its entry (or
# the whole entry); do not add entries for new code. Where the hits come from:
# - F403/F405: `from x import *` re-exports, not Django settings (those carry
#   their own noqa in apis/settings_test.py): the package re-exports in
#   origin/{models,serializers,urls,views}/__init__.py and the view/serializer/
#   url modules that star-import models and serializers. A removed or renamed
#   name that a star-importing module still uses is therefore NOT flagged here
#   and only fails at runtime with a NameError.
# - E402: imports placed after a module-level statement (a `logger = ...`, a
#   constant or a function).
# - F841: unused local variable (mostly under origin/tests).
# - E712: `== True` / `== False` comparisons.
[lint.per-file-ignores]
"origin/models/__init__.py" = ["F403"]
"origin/models/chat/activity_models.py" = ["F403", "F405"]
"origin/models/task/task_models.py" = ["E402"]
"origin/search_engine/agent/acl.py" = ["E402"]
"origin/search_engine/agent/controller.py" = ["E402", "F841"]
"origin/search_engine/agent/note_summary.py" = ["F841"]
"origin/serializers/__init__.py" = ["F403"]
"origin/serializers/note/note_serializers.py" = ["F403", "F405"]
"origin/serializers/project/prj_serializers.py" = ["F403", "F405"]
"origin/serializers/task/task_serializers.py" = ["F403", "F405"]
"origin/services/demo_seeder.py" = ["E402", "F841"]
"origin/tests/test_agent_body_on_user_model.py" = ["F841"]
"origin/tests/test_agent_decide_edits.py" = ["F841"]
"origin/tests/test_agent_dynamic_steps.py" = ["F841"]
"origin/tests/test_agent_mention_tokens_loop.py" = ["F841"]
"origin/tests/test_briefing.py" = ["F841"]
"origin/tests/test_models_task_project_note.py" = ["F841"]
"origin/tests/test_search_chunkers_agent.py" = ["F841"]
"origin/tests/test_serializers.py" = ["F841"]
"origin/tests/test_team_join_pins.py" = ["F841"]
"origin/tests/test_timeline.py" = ["F841"]
"origin/urls/__init__.py" = ["F403"]
"origin/urls/chat/urls.py" = ["F403", "F405"]
"origin/urls/common/urls.py" = ["F403", "F405"]
"origin/urls/note/urls.py" = ["F403", "F405"]
"origin/urls/project/urls.py" = ["F403", "F405"]
"origin/urls/task/urls.py" = ["F403", "F405"]
"origin/views/__init__.py" = ["F403"]
"origin/views/common/auth_views.py" = ["E402"]
"origin/views/common/inbox_views.py" = ["E712", "F403", "F405"]
"origin/views/note/chat_note_views.py" = ["F403", "F405"]
"origin/views/note/personal_note_views.py" = ["F403", "F405"]
"origin/views/note/task_note_views.py" = ["F403", "F405"]
"origin/views/project/prj_views.py" = ["F403", "F405"]
"origin/views/task/search_views.py" = ["E712", "F403", "F405"]
"origin/views/task/task_views.py" = ["E402", "E712", "F403", "F405", "F841"]
